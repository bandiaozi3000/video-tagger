<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Video Tagger · 设置</title>
  <style>
    :root {
      --bg: #0a0a15;
      --surface: #151528;
      --border: rgba(255, 255, 255, .09);
      --border-strong: rgba(255, 255, 255, .16);
      --pink: #ff4d8d;
      --violet: #a78bfa;
      --cyan: #35d6f2;
      --green: #4ade80;
      --text: #eceaf6;
      --text-dim: #9d9bb8;
      --text-faint: #6a6886;
      --grad: linear-gradient(135deg, #ff4d8d, #a78bfa 55%, #35d6f2);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    ::selection { background: rgba(255, 77, 141, .35); color: #fff; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", system-ui, sans-serif;
      min-height: 100vh; color: var(--text);
      background:
        radial-gradient(55% 45% at 15% 0%, rgba(255, 77, 141, .14), transparent 60%),
        radial-gradient(50% 45% at 90% 10%, rgba(167, 139, 250, .17), transparent 60%),
        radial-gradient(60% 55% at 55% 105%, rgba(53, 214, 242, .10), transparent 60%),
        linear-gradient(180deg, #0d0d1c, #08080f);
      display: flex; align-items: center; justify-content: center;
      padding: 32px 16px;
    }
    .panel {
      width: 100%; max-width: 560px;
      background: linear-gradient(180deg, rgba(24, 24, 44, .94), rgba(16, 16, 30, .94));
      border: 1px solid var(--border-strong);
      border-radius: 22px; padding: 30px 30px 26px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, .55), 0 0 60px rgba(167, 139, 250, .08);
      position: relative; overflow: hidden;
    }
    .panel::before {
      content: ''; position: absolute; top: 0; left: 26px; right: 26px;
      height: 3px; border-radius: 0 0 8px 8px; background: var(--grad);
    }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
    .logo-mark {
      width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0;
      background: var(--grad); color: #fff; display: grid; place-items: center;
      font-size: 20px; font-weight: 900;
      box-shadow: 0 8px 24px rgba(255, 77, 141, .4);
    }
    h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; color: #fff; font-family: "Yuanti SC", "YouYuan", "PingFang SC", "Microsoft YaHei UI", sans-serif; }
    .sub { font-size: 12px; color: var(--text-dim); margin-top: 3px; letter-spacing: .5px; }

    section { margin-bottom: 22px; }
    h3 {
      font-size: 13px; font-weight: 700; color: var(--text-dim);
      margin-bottom: 4px; display: flex; align-items: center; gap: 8px; letter-spacing: .5px;
    }
    h3::before { content: ''; width: 4px; height: 14px; border-radius: 4px; background: var(--grad); }
    .hint { font-size: 12px; color: var(--text-faint); margin: 6px 0 12px; line-height: 1.6; }

    .field-label { display: block; font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    input[type="text"], input:not([type]) {
      width: 100%; background: rgba(8, 8, 16, .6);
      border: 1px solid var(--border-strong); border-radius: 11px;
      color: var(--text); font-size: 14px; padding: 11px 14px;
      outline: none; font-family: inherit;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255, 77, 141, .15); }
    input::placeholder { color: var(--text-faint); }

    .slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
    .slots > div {
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 10px 10px 12px;
      transition: border-color .15s, transform .15s;
    }
    .slots > div:hover { border-color: rgba(255, 77, 141, .35); transform: translateY(-2px); }
    .slot-label {
      display: inline-block;
      font-family: "Cascadia Code", ui-monospace, Consolas, monospace;
      font-size: 10.5px; color: var(--text-dim);
      background: rgba(255, 255, 255, .05);
      border: 1px solid var(--border-strong); border-bottom-width: 2px;
      border-radius: 7px; padding: 3px 8px; margin-bottom: 8px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .3); letter-spacing: .3px;
    }
    .slots input { font-size: 13px; padding: 8px 10px; border-radius: 9px; }

    .checkbox {
      display: flex; align-items: center; gap: 9px;
      font-size: 13px; color: var(--text); cursor: pointer;
      padding: 11px 13px; background: rgba(255, 255, 255, .04);
      border: 1px solid var(--border); border-radius: 12px;
      margin-top: 10px; transition: border-color .15s;
    }
    .checkbox:hover { border-color: rgba(255, 77, 141, .35); }
    .checkbox input { accent-color: var(--pink); width: 15px; height: 15px; flex-shrink: 0; }

    button#save {
      width: 100%; margin-top: 4px; padding: 13px;
      border: none; border-radius: 12px;
      background: var(--grad); color: #fff;
      font-size: 14px; font-weight: 800; cursor: pointer;
      font-family: inherit; letter-spacing: 2px;
      box-shadow: 0 10px 26px rgba(255, 77, 141, .4);
      transition: all .15s;
    }
    button#save:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button#save:active { transform: translateY(0) scale(.99); }

    #status { margin-top: 12px; color: var(--cyan); font-size: 13px; text-align: center; min-height: 18px; font-weight: 600; }
  </style>
</head>
<body>
  <main class="panel">
    <header>
      <div class="logo-mark">✦</div>
      <div>
        <h1>Video Tagger</h1>
        <p class="sub">二次元视频打标扩展 · 设置</p>
      </div>
    </header>

    <section>
      <label class="field-label" for="backend">后端地址</label>
      <input id="backend" type="text" placeholder="http://localhost:8080" autocomplete="off">
    </section>

    <section>
      <h3>快捷标签位</h3>
      <p class="hint">在视频页按下对应组合键，直接弹出预填该标签的浮层，回车即存。</p>
      <div class="slots" id="slots"></div>
    </section>

    <section>
      <label class="checkbox">
        <input type="checkbox" id="quick-silent"> 快捷标签位静默直存（不弹浮层，立即保存）
      </label>
      <label class="checkbox">
        <input type="checkbox" id="watch-end"> 看完一集自动提示给本集打标签（默认关）
      </label>
    </section>

    <button id="save">保存设置</button>
    <div id="status"></div>
  </main>
  <script src="options.js"></script>
</body>
</html>
