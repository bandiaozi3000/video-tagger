server:
  port: 8080
  # 本地开发默认只监听回环地址；Docker 内通过 SERVER_ADDRESS=0.0.0.0 覆盖，
  # 宿主侧再以 127.0.0.1:8080:8080 发布端口，避免暴露到局域网
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  # 后端日志落盘到数据目录（跟随 VT_DATA_DIR，桌面版=项目根 data/logs/）
  file:
    name: ${VT_DATA_DIR:data}/logs/video-tagger.log
  level:
    root: INFO

spring:
  application:
    name: video-tagger
  datasource:
    # 桌面版默认 SQLite（唯一数据源）。迁移/Web 版连 MySQL 用 mysql profile（见下方）。
    url: jdbc:sqlite:${VT_DATA_DIR:data}/video_tagger.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite-schema.sql
      # 必须显式 UTF-8：schema 是 UTF-8 文件，spring.sql.init 未指定编码时用平台默认
      # （中文 Windows=GBK，会把分类种子读乱）。开发机 ACP=65001 侥幸正常，目标机 GBK 必乱。
      encoding: UTF-8
      continue-on-error: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10000MB
      max-request-size: 10000MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

videotagger:
  # v0.24 G6：v0.23 自建播放/片源 UI 隐藏开关（引擎保留；Animeko 接管播放前台）
  ui:
    show-v023-player: ${VT_SHOW_V023_PLAYER:false}
    # v0.24：旧「导出视频/单帧/连续截图」按钮退役（截图移入本地回顾播放器）
    show-v023-export: ${VT_SHOW_V023_EXPORT:false}
  video-sources:
    jellyfin:
      enabled: ${JELLYFIN_PROVIDER_ENABLED:false}
      base-url: ${JELLYFIN_BASE_URL:http://127.0.0.1:8096}
      user-id: ${JELLYFIN_USER_ID:}
      api-key: ${JELLYFIN_API_KEY:}
      timeout-ms: ${JELLYFIN_TIMEOUT_MS:10000}
      max-results: ${JELLYFIN_MAX_RESULTS:20}
      allow-private-network: ${JELLYFIN_ALLOW_PRIVATE_NETWORK:false}
    mikan:
      enabled: ${MIKAN_PROVIDER_ENABLED:false}
      base-url: ${MIKAN_BASE_URL:https://mikanani.me}
      search-url-template: ${MIKAN_SEARCH_URL_TEMPLATE:https://mikanani.me/RSS/Search?searchstr={keyword}}
      timeout-ms: ${MIKAN_TIMEOUT_MS:10000}
      max-results: ${MIKAN_MAX_RESULTS:100}
    dmhy:
      enabled: ${DMHY_PROVIDER_ENABLED:false}
      base-url: ${DMHY_BASE_URL:https://share.dmhy.org}
      search-url-template: ${DMHY_SEARCH_URL_TEMPLATE:https://share.dmhy.org/topics/rss/rss.xml?keyword={keyword}}
      timeout-ms: ${DMHY_TIMEOUT_MS:10000}
      max-results: ${DMHY_MAX_RESULTS:100}
    web-selector:
      enabled: ${WEB_SELECTOR_PROVIDER_ENABLED:false}
      id: ${WEB_SELECTOR_PROVIDER_ID:web-selector}
      display-name: ${WEB_SELECTOR_DISPLAY_NAME:Web Selector}
      base-url: ${WEB_SELECTOR_BASE_URL:https://example.com}
      search-url-template: ${WEB_SELECTOR_SEARCH_URL_TEMPLATE:https://example.com/search?q={keyword}}
      result-selector: ${WEB_SELECTOR_RESULT_SELECTOR:.result}
      result-title-selector: ${WEB_SELECTOR_RESULT_TITLE_SELECTOR:.title}
      result-link-selector: ${WEB_SELECTOR_RESULT_LINK_SELECTOR:a}
      episode-selector: ${WEB_SELECTOR_EPISODE_SELECTOR:.episode}
      episode-title-selector: ${WEB_SELECTOR_EPISODE_TITLE_SELECTOR:.title}
      episode-link-selector: ${WEB_SELECTOR_EPISODE_LINK_SELECTOR:a}
      media-selector: ${WEB_SELECTOR_MEDIA_SELECTOR:}
      media-attribute: ${WEB_SELECTOR_MEDIA_ATTRIBUTE:src}
      timeout-ms: ${WEB_SELECTOR_TIMEOUT_MS:10000}
      max-results: ${WEB_SELECTOR_MAX_RESULTS:20}
  metadata:
    bangumi:
      base-url: ${BANGUMI_BASE_URL:https://api.bgm.tv}
      access-token: ${BANGUMI_ACCESS_TOKEN:}
  # 数据根统一走 VT_DATA_DIR（桌面版注入 %APPDATA%），各子目录跟随
  cover-dir: ${COVER_DIR:${VT_DATA_DIR:data}/covers}
  site-dir: ${SITE_DIR:${VT_DATA_DIR:data}/site}
  export-dir: ${EXPORT_DIR:${VT_DATA_DIR:data}/exports}
  video-assets:
    root-dir: ${VIDEO_ASSET_ROOT_DIR:${VT_DATA_DIR:data}/video-assets}
  clip-export:
    video-dir: ${VIDEO_LIBRARY_DIR:${VT_DATA_DIR:data}/videos}
    video-output-dir: ${CLIP_VIDEO_OUTPUT_DIR:${VT_DATA_DIR:data}/clip-videos}
    image-output-dir: ${CLIP_IMAGE_OUTPUT_DIR:${VT_DATA_DIR:data}/clip-images}
    max-duration-sec: ${CLIP_EXPORT_MAX_DURATION_SEC:1800}
    task-timeout-sec: ${CLIP_EXPORT_TASK_TIMEOUT_SEC:3600}
    browser-max-size-bytes: ${CLIP_EXPORT_BROWSER_MAX_SIZE_BYTES:209715200}
    max-sequence-frames: ${CLIP_EXPORT_MAX_SEQUENCE_FRAMES:300}
    ffmpeg-path: ${CLIP_EXPORT_FFMPEG_PATH:${videotagger.render.ffmpeg-path}}
    allowed-extensions: mp4,mkv,webm,mov,avi,flv
  highlight:
    root-dir: ${HIGHLIGHT_ROOT_DIR:${VT_DATA_DIR:data}/highlight-projects}
    style-dir: ${HIGHLIGHT_STYLE_DIR:${VT_DATA_DIR:data}/highlight-styles}
    ffmpeg-path: ${HIGHLIGHT_FFMPEG_PATH:${videotagger.render.ffmpeg-path}}
    task-timeout-sec: ${HIGHLIGHT_TASK_TIMEOUT_SEC:3600}
    max-upload-bytes: ${HIGHLIGHT_MAX_UPLOAD_BYTES:524288000}
    max-download-bytes: ${HIGHLIGHT_MAX_DOWNLOAD_BYTES:524288000}
    max-duration-sec: ${HIGHLIGHT_MAX_DURATION_SEC:7200}
    max-items: ${HIGHLIGHT_MAX_ITEMS:200}
  # 旧 AniList/omofun 同步代码保留但不开放入口；当前开放同步仅走 Bangumi 元数据接口
  sync:
    enabled: ${VIDEOTAGGER_SYNC_ENABLED:false}
  # Animeko 桌面版 SQLite（只读观看事实）：设置后 v0.24 观看导入可用
  animeko:
    db-path: ${ANIMEKO_DB_PATH:}
    # Animeko 桌面可执行文件路径（空 = 自动探测：运行进程/常见安装位）；用于「去原视频」唤起 Animeko
    exe-path: ${ANIMEKO_EXE_PATH:}
  llm:
    # LLM 后台归组（番剧别名识别）默认关闭；开启需在 .env 注入 LLM_* 环境变量
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    grouping-enabled: ${LLM_GROUPING_ENABLED:false}
  milvus:
    uri: ${MILVUS_URI:http://localhost:19530}
    collection: clip_embeddings_v2
    # ANN 相似度下限（余弦）：相关命中普遍 ≥0.55，无关噪声最高约 0.43，默认 0.45 可分界；可按所用 embedding 模型实测调整
    min-cosine-score: ${MIN_COSINE_SCORE:0.45}
  vector:
    # 向量功能总开关：false = 不连 Milvus、不生成 embedding，搜索降级纯关键词（当前默认关）
    enabled: ${VIDEOTAGGER_VECTOR_ENABLED:false}
  embedding:
    # 密钥只通过环境变量注入（.env），禁止在此硬编码兜底默认值
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    dim: ${EMBEDDING_DIM:1024}
  render:
    # 推荐 HTML → 视频导出工具链（本机可用；Docker 容器内未装 → 视频导出不可用）
    # scripts-dir 相对应用工作目录（IDE 从项目根启动，mvn spring-boot:run 从 backend 启动）；
    # RecommendVideoService 会在找不到 render.js 时按常见候选兜底，双场景均可命中
    scripts-dir: ${RENDER_SCRIPTS_DIR:backend/scripts}
    node-path: ${RENDER_NODE_PATH:node}
    chrome-path: ${RENDER_CHROME_PATH:C:/Program Files/Google/Chrome/Application/chrome.exe}
    ffmpeg-path: ${RENDER_FFMPEG_PATH:${user.home}/.local/ffmpeg/bin/ffmpeg.exe}
---
# MySQL profile：数据迁移工具专用（从 MySQL 读数据迁到 SQLite）。桌面版运行不启用。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/video_tagger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123456}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
