server:
  port: 9010
  # 本地开发默认只监听回环地址；Docker 内通过 SERVER_ADDRESS=0.0.0.0 覆盖，
  # 宿主侧再以 127.0.0.1:8080:8080 发布端口，避免暴露到局域网
  address: ${SERVER_ADDRESS:127.0.0.1}

logging:
  # 后端日志落盘到数据目录（跟随 VT_DATA_DIR，桌面版=项目根 data/logs/）
  file:
    name: ${VT_DATA_DIR:data}/logs/video-tagger.log
  level:
    root: INFO

spring:
  application:
    name: video-tagger
  datasource:
    # 桌面版默认 SQLite（唯一数据源）。迁移/Web 版连 MySQL 用 mysql profile（见下方）。
    url: jdbc:sqlite:${VT_DATA_DIR:data}/video_tagger.db
    driver-class-name: org.sqlite.JDBC
    username:
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/sqlite-schema.sql
      # 必须显式 UTF-8：schema 是 UTF-8 文件，spring.sql.init 未指定编码时用平台默认
      # （中文 Windows=GBK，会把分类种子读乱）。开发机 ACP=65001 侥幸正常，目标机 GBK 必乱。
      encoding: UTF-8
      continue-on-error: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

videotagger:
  # 数据根统一走 VT_DATA_DIR（桌面版注入 %APPDATA%），各子目录跟随
  cover-dir: ${COVER_DIR:${VT_DATA_DIR:data}/covers}
  site-dir: ${SITE_DIR:${VT_DATA_DIR:data}/site}
  export-dir: ${EXPORT_DIR:${VT_DATA_DIR:data}/exports}
  # 外部同步（AniList/omofuna 按年份批量导入）：默认开启；需联网。设为 false 可禁用（同步入口 404）
  sync:
    enabled: ${VIDEOTAGGER_SYNC_ENABLED:true}
  llm:
    # LLM 后台归组（番剧别名识别）默认关闭；开启需在 .env 注入 LLM_* 环境变量
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    grouping-enabled: ${LLM_GROUPING_ENABLED:false}
  milvus:
    uri: ${MILVUS_URI:http://localhost:19530}
    collection: clip_embeddings_v2
    # ANN 相似度下限（余弦）：相关命中普遍 ≥0.55，无关噪声最高约 0.43，默认 0.45 可分界；可按所用 embedding 模型实测调整
    min-cosine-score: ${MIN_COSINE_SCORE:0.45}
  vector:
    # 向量功能总开关：false = 不连 Milvus、不生成 embedding，搜索降级纯关键词（当前默认关）
    enabled: ${VIDEOTAGGER_VECTOR_ENABLED:false}
  embedding:
    # 密钥只通过环境变量注入（.env），禁止在此硬编码兜底默认值
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    dim: ${EMBEDDING_DIM:1024}
  render:
    # 推荐 HTML → 视频导出工具链（本机可用；Docker 容器内未装 → 视频导出不可用）
    # scripts-dir 相对应用工作目录（IDE 从项目根启动，mvn spring-boot:run 从 backend 启动）；
    # RecommendVideoService 会在找不到 render.js 时按常见候选兜底，双场景均可命中
    scripts-dir: ${RENDER_SCRIPTS_DIR:backend/scripts}
    node-path: ${RENDER_NODE_PATH:node}
    chrome-path: ${RENDER_CHROME_PATH:C:/Program Files/Google/Chrome/Application/chrome.exe}
    ffmpeg-path: ${RENDER_FFMPEG_PATH:${user.home}/.local/ffmpeg/bin/ffmpeg.exe}

---
# MySQL profile：数据迁移工具专用（从 MySQL 读数据迁到 SQLite）。桌面版运行不启用。
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/video_tagger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123456}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
