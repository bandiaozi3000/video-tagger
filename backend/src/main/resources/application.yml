server:
  port: 8080
  # 本地开发默认只监听回环地址；Docker 内通过 SERVER_ADDRESS=0.0.0.0 覆盖，
  # 宿主侧再以 127.0.0.1:8080:8080 发布端口，避免暴露到局域网
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: video-tagger
  datasource:
    url: jdbc:mysql://localhost:3306/video_tagger?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root123456}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

videotagger:
  cover-dir: ${COVER_DIR:data/covers}
  milvus:
    uri: ${MILVUS_URI:http://localhost:19530}
    collection: clip_embeddings
  embedding:
    # 密钥只通过环境变量注入（.env），禁止在此硬编码兜底默认值
    base-url: ${EMBEDDING_BASE_URL:}
    api-key: ${EMBEDDING_API_KEY:}
    model: ${EMBEDDING_MODEL:text-embedding-v4}
    dim: ${EMBEDDING_DIM:1024}
