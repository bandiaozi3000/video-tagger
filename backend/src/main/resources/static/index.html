<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Tagger</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<main class="container">
    <nav class="nav">
        <h1 class="logo">Video Tagger</h1>
        <div class="nav-tabs">
            <button type="button" class="tab active" data-view="search">搜索</button>
            <button type="button" class="tab" data-view="anime">番剧</button>
            <button type="button" class="tab" data-view="videos">时间线</button>
            <button type="button" class="tab" data-view="stats">统计</button>
        </div>
    </nav>

    <!-- 番剧视图 -->
    <section id="view-anime" hidden>
        <div class="anime-toolbar">
            <div class="anime-tabs">
                <button type="button" class="atab active" data-anime-tab="recent">最近观看</button>
                <button type="button" class="atab" data-anime-tab="all">全部番剧</button>
            </div>
            <button type="button" id="anime-create" class="btn-primary">＋ 新建番剧</button>
        </div>
        <div id="anime-status" class="status"></div>
        <section id="anime-grid" class="anime-grid"></section>
    </section>

    <!-- 番剧详情视图 -->
    <section id="view-anime-detail" hidden>
        <button type="button" id="back-to-anime" class="back-btn">← 返回番剧</button>
        <div id="anime-detail-head" class="anime-detail-head"></div>
        <div class="detail-actions">
            <button type="button" id="detail-edit" class="btn-mini">编辑信息</button>
            <button type="button" id="detail-rename" class="btn-mini">改名/合并</button>
            <button type="button" id="detail-cover" class="btn-mini">设置封面</button>
            <button type="button" id="detail-delete" class="btn-mini danger">删除</button>
        </div>
        <h3 class="stats-title">作品标签</h3>
        <div id="detail-tags" class="detail-tags"></div>
        <h3 class="stats-title">集列表</h3>
        <section id="episode-list" class="episode-list"></section>
        <div id="detail-status" class="status"></div>
    </section>

    <!-- 搜索视图 -->
    <section id="view-search">
        <form id="search-form" class="search-box">
            <input id="search-input" type="text" placeholder="用自然语言描述你想找的片段，如「主角爆种的战斗场面」"
                   autocomplete="off" autofocus>
            <button type="button" id="clear-btn" title="清空">&times;</button>
        </form>
        <div id="semantic-hint" class="semantic-hint" hidden>语义搜索未启用（未配置 Embedding API），当前为关键词搜索</div>
        <div id="status" class="status"></div>
        <section id="results" class="results"></section>
    </section>

    <!-- 视频列表视图 -->
    <section id="view-videos" hidden>
        <div id="video-status" class="status"></div>
        <section id="video-list" class="results"></section>
        <button type="button" id="load-more" class="load-more" hidden>加载更多</button>
    </section>

    <!-- 时间线视图 -->
    <section id="view-timeline" hidden>
        <button type="button" id="back-to-videos" class="back-btn">← 返回视频列表</button>
        <h2 id="timeline-title" class="timeline-title"></h2>
        <div id="timeline-axis" class="timeline-axis"></div>
        <div id="timeline-status" class="status"></div>
        <section id="timeline-clips" class="results"></section>
    </section>

    <!-- 统计视图 -->
    <section id="view-stats" hidden>
        <div class="stats-cards">
            <div class="stat-card"><div class="stat-num" id="stat-clips">–</div><div class="stat-label">标签片段</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-videos">–</div><div class="stat-label">视频</div></div>
            <div class="stat-card"><div class="stat-num" id="stat-tags">–</div><div class="stat-label">标签数</div></div>
        </div>
        <h3 class="stats-title">最常用标签</h3>
        <div id="stats-tags" class="stats-tags"></div>
        <h3 class="stats-title">按站点分布</h3>
        <div id="stats-sites" class="stats-chart"></div>
        <h3 class="stats-title">近 30 天标记趋势</h3>
        <div id="stats-trend" class="stats-chart"></div>
        <div id="stats-status" class="status"></div>
    </section>
</main>

<!-- 相似片段弹窗 -->
<div id="similar-modal" class="modal-overlay" hidden>
    <div class="modal modal-wide">
        <h2>相似片段</h2>
        <div id="similar-status" class="status"></div>
        <section id="similar-results" class="results"></section>
        <div class="modal-actions">
            <button id="similar-close" type="button">关闭</button>
        </div>
    </div>
</div>

<div id="edit-modal" class="modal-overlay" hidden>
    <div class="modal">
        <h2>编辑标签</h2>
        <label>标题<input id="edit-title" autocomplete="off"></label>
        <label>标签<input id="edit-tag" autocomplete="off"></label>
        <label>备注<input id="edit-note" autocomplete="off"></label>
        <label>时间戳（秒）<input id="edit-time" type="number" step="0.1" min="0"></label>
        <div class="modal-actions">
            <button id="edit-cancel" type="button">取消</button>
            <button id="edit-save" type="button">保存</button>
        </div>
    </div>
</div>

<!-- 新建 / 编辑番剧 -->
<div id="anime-modal" class="modal-overlay" hidden>
    <div class="modal">
        <h2 id="anime-modal-title">新建番剧</h2>
        <label>标题<input id="anime-title" autocomplete="off"></label>
        <label>类型
            <select id="anime-type">
                <option value="ANIME">动画</option>
                <option value="MOVIE">电影</option>
            </select>
        </label>
        <label>状态
            <select id="anime-status">
                <option value="WANT">想看</option>
                <option value="WATCHING">在看</option>
                <option value="DONE">看完</option>
                <option value="PAUSED">搁置</option>
                <option value="DROPPED">弃番</option>
            </select>
        </label>
        <label>评分（0~10）<input id="anime-rating" type="number" min="0" max="10" step="0.5" autocomplete="off"></label>
        <div class="modal-actions">
            <button id="anime-modal-cancel" type="button">取消</button>
            <button id="anime-modal-save" type="button">保存</button>
        </div>
    </div>
</div>

<!-- 设置封面 -->
<div id="cover-modal" class="modal-overlay" hidden>
    <div class="modal">
        <h2>设置封面</h2>
        <label>图片 URL<input id="cover-url" autocomplete="off" placeholder="https://..."></label>
        <label>或上传图片<input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp"></label>
        <div class="modal-actions">
            <button id="cover-modal-cancel" type="button">取消</button>
            <button id="cover-modal-save" type="button">保存</button>
        </div>
    </div>
</div>

<!-- 改名 / 合并 -->
<div id="rename-modal" class="modal-overlay" hidden>
    <div class="modal">
        <h2>改名 / 合并</h2>
        <label>新标题（改名用，可为空）<input id="rename-title" autocomplete="off"></label>
        <label>合并到（选填，优先于改名）
            <select id="merge-into"><option value="">— 不合并 —</option></select>
        </label>
        <div class="modal-actions">
            <button id="rename-cancel" type="button">取消</button>
            <button id="rename-save" type="button">保存</button>
        </div>
    </div>
</div>

<!-- 集级打标 -->
<div id="episode-tag-modal" class="modal-overlay" hidden>
    <div class="modal">
        <h2>给本集打标签</h2>
        <div id="episode-tag-target" class="episode-tag-target"></div>
        <label>标签<input id="episode-tag-input" autocomplete="off" placeholder="如：神回"></label>
        <div class="modal-actions">
            <button id="episode-tag-cancel" type="button">取消</button>
            <button id="episode-tag-save" type="button">添加</button>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
