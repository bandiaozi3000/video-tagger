<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
  /* ============ 深夜霓虹 · 暗房闪回开场 + stream 连续流式分组 ============
     开头：封面碎片乱序「缓缓浮现」显影（灰阶→彩色注入）
     正片：SLIDES 带 group → 组间插斜切转场横幅 + 组徽章；无 group → 直排逐部
     ?record=1 为视频渲染录制模式：忽略交互打断，全程自动导览 */
  :root{
    --bg-0:#07060d; --bg-1:#100e1e; --bg-2:#191428;
    --ink:#ece9f6; --muted:#9d97b8; --faint:#6b6690;
    --sky:#4fc3f7; --blue:#6f8bff; --pink:#ff8fb8; --gold:#ffd166;
    --line:rgba(255,255,255,.09); --card:rgba(20,16,38,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-snap-type:y proximity}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(79,195,247,.16), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(111,139,255,.13), transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,#0a0916);
    min-height:100vh;position:relative;overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;pointer-events:none;opacity:.85;z-index:0}
  body::before{content:"";position:fixed;left:-10%;right:-10%;top:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--sky),var(--blue),var(--pink),transparent);
    filter:blur(.5px);opacity:.9;z-index:2;animation:topline 9s ease-in-out infinite;}
  @keyframes topline{0%,100%{opacity:.5}50%{opacity:1}}
  .cloud{position:fixed;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle,rgba(111,139,255,.34) 0%,rgba(111,139,255,0) 70%);
    filter:blur(26px);animation:drift linear infinite;}
  @keyframes drift{0%{transform:translate3d(-4vw,2vh,0) scale(1)}
    50%{transform:translate3d(4vw,-3vh,0) scale(1.08)}
    100%{transform:translate3d(-4vw,2vh,0) scale(1)}}
  .content{position:relative;z-index:2}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 30px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:14px;color:var(--ink)}
  .brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--sky),var(--blue) 55%,var(--pink));
    box-shadow:0 4px 18px rgba(79,195,247,.5);font-size:15px;color:#08070f;}
  .auto-badge{position:fixed;top:74px;right:24px;z-index:30;display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;letter-spacing:1px;color:#08070f;
    background:linear-gradient(135deg,var(--sky),var(--blue) 60%,var(--pink));
    padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(79,195,247,.5);}
  .auto-badge[hidden]{display:none}
  .auto-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#08070f;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  /* ========== 开场：暗房闪回 ========== */
  .hero{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:110px 20px 60px;text-align:center;}
  .hero::after{content:'';position:absolute;right:5%;bottom:6%;width:300px;height:300px;pointer-events:none;
    background:radial-gradient(circle,rgba(255,143,184,.13),transparent 65%);filter:blur(22px);}
  .hero::before{content:'';position:absolute;left:8%;top:16%;width:260px;height:260px;pointer-events:none;
    background:radial-gradient(circle,rgba(79,195,247,.10),transparent 65%);filter:blur(24px);}
  .hero-plate{position:relative;z-index:6;text-align:center;padding:30px 50px 27px;border-radius:26px;
    background:linear-gradient(160deg,rgba(18,15,34,.78),rgba(10,8,22,.62));
    border:1px solid rgba(130,160,255,.24);box-shadow:0 0 44px rgba(79,195,247,.28),inset 0 0 34px rgba(111,139,255,.08);
    backdrop-filter:blur(8px);}
  .hero-plate .eyebrow{font-size:11px;letter-spacing:5px;color:var(--sky);font-weight:600;margin-bottom:12px;}
  .hero-plate h1{font-size:clamp(28px,4.6vw,46px);font-weight:800;letter-spacing:7px;white-space:nowrap;
    background:linear-gradient(115deg,#fff 8%,#bfe0ff 45%,#9fd4ff 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 16px rgba(79,195,247,.55));margin-bottom:9px;}
  .hero-plate .sub{font-size:12px;color:var(--muted);letter-spacing:2px}
  .hero-plate .sub b{color:var(--gold);font-style:normal}
  .darkroom{position:absolute;inset:0;pointer-events:none}
  .card{position:absolute;left:50%;top:52%;width:190px;height:270px;border-radius:14px;overflow:hidden;
    pointer-events:auto;cursor:pointer;opacity:0;transform-origin:center center;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 22px 54px rgba(5,8,30,.65);
    transition:box-shadow .4s ease,filter .4s ease,border-color .4s,opacity .9s ease;}
  .card .cover{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));
    filter:grayscale(1) blur(5px) contrast(.8) brightness(.7);opacity:0;}
  .card .cover.develop{opacity:1;transition:filter 1.6s ease,opacity 1.4s ease;}
  .card .cover.done{filter:grayscale(0) blur(0) contrast(1.04) brightness(1)}
  .card .cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,8,30,.62));}
  .card .name{position:absolute;left:13px;right:13px;bottom:13px;z-index:2;font-size:14px;font-weight:600;
    letter-spacing:1px;color:#f4f6ff;text-shadow:0 2px 10px rgba(0,0,0,.75);opacity:0;transition:opacity .45s ease .1s;}
  .card.mount .name{opacity:1}
  .card.mount{border-color:rgba(255,255,255,.2);box-shadow:0 24px 56px rgba(5,8,30,.7),0 0 34px rgba(111,139,255,.12);}
  .card:hover{border-color:rgba(255,255,255,.42);box-shadow:0 28px 64px rgba(5,8,30,.75),0 0 46px rgba(79,195,247,.22);}
  .dev-count{display:none;position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:20;font-size:12px;letter-spacing:3px;
    color:var(--muted);opacity:0;transition:opacity .4s;}
  .dev-count.show{opacity:1}
  .dev-count b{color:var(--pink);font-weight:800}
  .skip{position:fixed;right:22px;bottom:20px;z-index:40;font-family:inherit;font-size:11.5px;letter-spacing:1px;
    color:var(--muted);background:rgba(20,16,38,.6);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s;}
  .skip:hover{color:var(--ink);border-color:var(--sky)}
  .skip[hidden]{display:none}

  /* ========== Story：连续流式（组间斜切转场横幅） ========== */
  .story{max-width:1160px;margin:0 auto;padding:20px 24px 80px}
  /* --- 序言页（intro 非空时，开局后显示） --- */
  .prologue{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:70px 20px;text-align:center;position:relative;overflow:hidden;}
  .prologue::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(700px 420px at 50% 55%, rgba(79,195,247,.14), transparent 70%);filter:blur(40px);}
  .prologue .pl-kicker{position:relative;font-size:12px;letter-spacing:9px;color:var(--sky);font-weight:600;margin-bottom:20px;}
  .prologue h2{position:relative;font-size:clamp(34px,6vw,64px);font-weight:900;letter-spacing:6px;line-height:1.08;
    background:linear-gradient(115deg,#fff 10%,var(--sky) 55%,#9fd4ff 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 26px rgba(79,195,247,.4));}
  .prologue .pl-text{position:relative;max-width:62ch;margin-top:28px;font-size:16px;line-height:2.1;color:var(--muted);}
  .prologue .pl-cta{position:relative;margin-top:44px;font-size:12px;letter-spacing:6px;color:var(--gold);
    animation:blink 2s ease-in-out infinite;}
  /* --- 结尾回顾墙 --- */
  .ending{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:70px 20px;text-align:center;position:relative;overflow:hidden;}
  .ending::before{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(700px 420px at 50% 55%, rgba(255,143,184,.13), transparent 70%);filter:blur(40px);}
  .ending .en-kicker{position:relative;font-size:12px;letter-spacing:9px;color:var(--pink);font-weight:600;margin-bottom:18px;}
  .ending h2{position:relative;font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:5px;color:#fff;}
  .ending .en-wall{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:36px 0;max-width:920px;}
  .ending .en-wall img{width:72px;height:102px;object-fit:cover;border-radius:8px;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 26px rgba(0,0,0,.45);
    opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s ease;}
  .ending.in-view .en-wall img{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 45ms)}
  /* 分组总结 + 分页 */
  /* 结尾分组回顾：内部滚动容器（全排 + 连续自动滚动，滚到底收尾） */
  .ending .en-scroll{height:66vh;overflow-y:auto;overflow-x:hidden;max-width:920px;width:100%;margin:26px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .ending .en-scroll::-webkit-scrollbar{display:none}
  .ending .en-groups{display:flex;flex-direction:column;gap:20px;max-width:920px;width:100%}
  .ending .en-group{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:14px 16px;background:rgba(10,10,22,.45)}
  .ending .en-group-name{font-size:13px;letter-spacing:2px;color:var(--sky);font-weight:700;margin-bottom:12px}
  .ending .en-group-covers{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding:4px 2px}
  .ending .en-group-covers::-webkit-scrollbar{display:none}
  .ending .en-group-covers img{flex:none;width:74px;height:106px;object-fit:cover;border-radius:8px;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 24px rgba(0,0,0,.4)}
  .ending .en-pager{display:flex;align-items:center;gap:12px;margin-top:18px;font-size:13px;color:var(--muted)}
  .ending .en-pager button{font-family:inherit;font-size:13px;color:var(--ink);background:rgba(255,255,255,.07);
    border:1px solid var(--line);border-radius:8px;padding:6px 16px;cursor:pointer}
  .ending .en-pager button:hover{background:rgba(255,255,255,.14)}
  .ending .en-pager button:disabled{opacity:.35;cursor:not-allowed}
  .interlude{scroll-snap-align:start;position:relative;min-height:100vh;overflow:hidden;
    display:grid;grid-template-columns:minmax(0,6fr) minmax(0,4fr);align-items:center;gap:30px;
    padding:70px 40px;scroll-margin-top:70px;
    clip-path:polygon(0 0,100% 0,97.5% 100%,0 100%);
    background:linear-gradient(160deg,rgba(12,10,26,.4),rgba(7,6,13,.75));
    border-bottom:1px solid var(--line);}
  .interlude::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
    background:linear-gradient(180deg,var(--cg),transparent);opacity:.8;}
  .interlude::after{content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(900px 560px at 20% 55%, var(--cg), transparent 68%);
    filter:blur(46px);opacity:.5;}
  .il-left{position:relative;z-index:2;padding-left:26px}
  .il-no{font-size:12px;letter-spacing:8px;color:var(--faint);font-weight:600;
    opacity:0;transform:translateY(14px);transition:opacity .7s ease .05s,transform .7s ease .05s;}
  .il-no .bar{display:inline-block;width:34px;height:1px;background:var(--cg);vertical-align:middle;margin-right:10px}
  .il-title{font-size:clamp(44px,8vw,84px);font-weight:900;letter-spacing:5px;line-height:1.02;margin-top:18px;
    background:linear-gradient(115deg,#fff 8%,var(--cg) 60%,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 6px 26px var(--cg));
    opacity:0;transform:translateY(22px);transition:opacity .75s ease .15s,transform .75s ease .15s;}
  .il-sub{margin-top:16px;font-size:14px;letter-spacing:3px;color:var(--muted);
    opacity:0;transform:translateY(16px);transition:opacity .7s ease .25s,transform .7s ease .25s;}
  .il-sub b{color:var(--gold);font-weight:800}
  .il-count{display:inline-flex;align-items:center;gap:8px;margin-top:26px;font-size:12px;letter-spacing:2px;
    color:#0a0812;background:linear-gradient(120deg,var(--cg),#fff);padding:7px 16px;border-radius:999px;
    font-weight:700;opacity:0;transform:translateY(16px);transition:opacity .7s ease .35s,transform .7s ease .35s;}
  .interlude.in-view .il-no{opacity:1;transform:none}
  .interlude.in-view .il-title{opacity:1;transform:none}
  .interlude.in-view .il-sub{opacity:1;transform:none}
  .interlude.in-view .il-count{opacity:1;transform:none}
  .il-wall{position:relative;z-index:2;height:min(52vh,440px);
    display:flex;align-items:center;gap:12px;overflow-x:auto;overflow-y:hidden;
    padding:8px 4px;opacity:0;transform:scale(.94);transition:opacity .8s ease .3s,transform .8s ease .3s;}
  .interlude.in-view .il-wall{opacity:1;transform:none}
  .il-wall img{flex:none;height:100%;width:auto;aspect-ratio:3/4;object-fit:cover;border-radius:12px;
    border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 44px rgba(0,0,0,.55);}
  .il-wall{scrollbar-width:none}
  .il-wall::-webkit-scrollbar{display:none}

  /* --- 组内 Story 卡（完整 + 组徽章） --- */
  .story-card{scroll-snap-align:start;position:relative;min-height:100vh;
    display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:46px;align-items:center;
    padding:40px 10px;scroll-margin-top:40px;}
  .group-badge{position:absolute;right:0;top:9%;z-index:3;display:inline-flex;align-items:center;gap:7px;
    font-size:11px;letter-spacing:2px;color:#0a0812;background:linear-gradient(120deg,var(--cg),#fff);
    padding:5px 14px;border-radius:999px 0 0 999px;font-weight:700;
    box-shadow:0 4px 16px rgba(0,0,0,.3);opacity:0;transform:translateX(16px);
    transition:opacity .5s ease .2s,transform .5s ease .2s;}
  .group-badge .p{font-weight:800}
  .story-card.in-view .group-badge{opacity:1;transform:none}
  .sc-no{position:absolute;right:2%;bottom:8%;font-size:110px;font-weight:900;line-height:1;
    color:transparent;-webkit-text-stroke:1.5px rgba(111,139,255,.25);pointer-events:none;letter-spacing:4px;}
  .sc-poster{position:relative;border-radius:18px;overflow:hidden;z-index:1;aspect-ratio:3/4;max-height:46vh;
    border:1px solid rgba(255,255,255,.12);box-shadow:0 26px 60px rgba(0,0,0,.6);
    background:linear-gradient(160deg,#221a3a,#0d0a18);}
  .sc-poster::after{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
    box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .5s;}
  .story-card.in-view .sc-poster::after{box-shadow:inset 0 0 0 1px rgba(79,195,247,.55),0 0 34px rgba(79,195,247,.28);}
  .sc-poster img{width:100%;height:100%;object-fit:cover;display:block;
    animation:kenburns 18s ease-in-out infinite alternate;animation-play-state:paused;}
  .story-card.in-view .sc-poster img{animation-play-state:running}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
  .sc-poster .flag{position:absolute;left:12px;top:12px;z-index:2;
    font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:999px;
    color:#ffd9a6;background:rgba(255,143,77,.14);border:1px solid rgba(255,143,77,.35);
    backdrop-filter:blur(4px);}
  .sc-info{z-index:1;padding:10px 2px}
  .sc-info > *{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
  .story-card.in-view .sc-info > *{opacity:1;transform:none}
  .story-card.in-view .sc-info > *:nth-child(1){transition-delay:.05s}
  .story-card.in-view .sc-info > *:nth-child(2){transition-delay:.15s}
  .story-card.in-view .sc-info > *:nth-child(3){transition-delay:.25s}
  .story-card.in-view .sc-info > *:nth-child(4){transition-delay:.35s}
  .story-card.in-view .sc-info > *:nth-child(5){transition-delay:.45s}
  .sc-info .kicker{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:2px;
    color:var(--sky);font-weight:600;margin-bottom:12px;}
  .sc-info .kicker::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,var(--sky),transparent)}
  .sc-info .cat{display:inline-block;font-size:12px;letter-spacing:1px;color:#0a0812;
    background:linear-gradient(120deg,var(--sky),var(--blue));padding:4px 12px;border-radius:999px;
    font-weight:700;margin-bottom:14px;box-shadow:0 4px 16px rgba(79,195,247,.4);}
  .sc-info h2{font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:2px;line-height:1.15;
    background:linear-gradient(115deg,#fff 8%,#bfe0ff 45%,#9fd4ff 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 12px rgba(79,195,247,.5));margin-bottom:14px;}
  .sc-info .note{font-size:14.5px;line-height:1.9;color:var(--muted);margin-bottom:18px;max-width:56ch;}
  .sc-info .tags{display:flex;flex-wrap:wrap;gap:9px}
  .chip{font-size:12.5px;letter-spacing:.5px;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;}
  .chip b{font-weight:800;font-size:11px}
  .s1{color:#b8c4da;background:rgba(163,174,196,.1)}
  .s2{color:#8fd0ff;background:rgba(79,195,247,.13);border-color:rgba(79,195,247,.4)}
  .s3{color:#a9c2ff;background:rgba(111,139,255,.14);border-color:rgba(111,139,255,.4)}
  .s4{color:#ffc07a;background:rgba(251,146,60,.14);border-color:rgba(251,146,60,.4)}
  .s5{color:#ffe08a;background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.5);
    box-shadow:0 0 16px rgba(251,191,36,.22);}

  /* 底部轨道条 */
  .trackbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;
    display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:8px 18px;backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .4s;font-size:12.5px;letter-spacing:1px;color:var(--muted);}
  .trackbar.show{opacity:1;pointer-events:auto}
  .trackbar b{color:var(--ink);font-weight:800}
  .trackbar .cur{color:var(--pink)}
  .tb-progress{width:150px;height:3px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.09);opacity:0;transition:opacity .3s;}
  .trackbar.auto .tb-progress{opacity:1}
  .tb-progress i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--sky),var(--blue),var(--pink));box-shadow:0 0 12px rgba(79,195,247,.8);}
  .tb-progress i.run{animation:tbprog 6s linear forwards}
  @keyframes tbprog{from{width:0}to{width:100%}}

  /* BGM 胶囊 */
  .bgm-bar{position:fixed;left:14px;bottom:8%;z-index:50;display:flex;align-items:center;gap:9px;
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 16px;
    backdrop-filter:blur(14px);max-width:min(92vw,600px);box-shadow:0 10px 34px rgba(0,0,0,.55);}
  .bgm-bar[hidden]{display:none}
  .bgm-bar::before{content:'';width:6px;height:6px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--pink),var(--gold));box-shadow:0 0 10px rgba(255,143,184,.7);}
  .bgm-play,.bgm-mute{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:12px;
    padding:2px 5px;line-height:1;flex:none;transition:color .2s;}
  .bgm-play:hover,.bgm-mute:hover{color:var(--ink)}
  .bgm-mute.muted{color:var(--faint)}
  .bgm-name{font-size:12.5px;color:var(--ink);letter-spacing:.5px;flex:0 1 auto;min-width:0;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bgm-bar.next .bgm-name{color:var(--gold)}
  .bgm-progress{width:110px;height:3px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;cursor:pointer;flex:none}
  .bgm-progress i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--sky),var(--blue),var(--pink));box-shadow:0 0 12px rgba(79,195,247,.8);}
  .bgm-time{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none;letter-spacing:.5px}

  @media (max-width:860px){
    .hero-plate{padding:20px 24px 18px}.hero-plate h1{font-size:24px;letter-spacing:4px}
    .interlude{grid-template-columns:1fr;padding:90px 24px;clip-path:none}
    .il-wall{display:none}
    .story-card{grid-template-columns:1fr;gap:20px;padding:36px 8px;text-align:center}
    .sc-poster{max-height:44vh}.sc-no{font-size:70px}
    .group-badge{top:2%;font-size:10px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="clouds"></div>
<div class="content">
  <header class="topbar"><div class="brand"><span class="logo">✦</span><span>我的番剧推荐</span></div>
    <span class="auto-badge" id="autoBadge" hidden>✦ 自动导览中</span></header>

  <section class="hero" id="hero">
    <div class="darkroom" id="darkroom"></div>
    <div class="hero-plate">
      <div class="eyebrow">SEASON IN REVIEW</div>
      <h1>__TITLE__</h1>
      <div class="sub" id="heroSub">__SUBTITLE__</div>
    </div>
    <div class="dev-count" id="devCount"><b id="devIdx">0</b> 显影中</div>
    <button class="skip" id="skipBtn">跳过开场 ›</button>
  </section>

  <main class="story" id="story"></main>

  <div class="trackbar" id="trackbar"><span id="tbLabel">—</span>
    <div class="tb-progress"><i id="tbProg"></i></div></div>

  <div class="bgm-bar" id="bgmBar" hidden>
    <button class="bgm-play" id="bgmPlayBtn" title="播放/暂停">▶</button>
    <span class="bgm-name" id="bgmName"></span>
    <div class="bgm-progress" id="bgmProgTrack" title="点击跳转进度"><i id="bgmProg"></i></div>
    <span class="bgm-time" id="bgmTime">0:00 / 0:00</span>
    <button class="bgm-mute" id="bgmMuteBtn" title="静音/取消静音">♪</button>
  </div>
  <audio id="bgmAudio" preload="auto"></audio>
</div>

<script>
/* ========== 数据注入（后端渲染时替换为真实媒体数据 JSON 数组） ========== */
const SLIDES = __SLIDES_JSON__;

const IS_RECORD = new URLSearchParams(location.search).get('record') === '1';
const INTRO = "__INTRO__";   /* 主题简介（后端注入；空 → 不显示序言页） */
const BG_COLOR = "__BG_COLOR__";   /* 背景主题色（后端注入；空 → 用默认） */
const BG_IMAGES = __BG_IMAGES__;                 /* 背景图多选 dataURI 数组（后端注入） */
const BG_ROTATION_SEC = Number("__BG_ROTATION_SEC__") || 8;
const BG_OPACITY = Number("__BG_OPACITY__") || 100;   /* 不透明度：0=透明, 100=不透明（清晰） */
const BG_BRIGHTNESS = Number("__BG_BRIGHTNESS__") || 50;   /* 明亮度：50=正常 */
const BG_BLUR = Number("__BG_BLUR__") || 0;
if (Array.isArray(BG_IMAGES) && BG_IMAGES.length) {
  /* 独立固定背景层：多图轮换 + 透明度/模糊度，锁视口沉底不喧宾夺主 */
  let bgIdx = 0;
  const bg = document.createElement('div');
  bg.className = 'bg-image-layer';
  bg.style.cssText = 'position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;transition:opacity .8s;pointer-events:none;';
  bg.style.backgroundImage = 'url("' + BG_IMAGES[0] + '")';
  bg.style.opacity = BG_OPACITY / 100;   // 不透明度：0=透明, 100=不透明
  const bgFilters = [];
  if (BG_BRIGHTNESS !== 50) bgFilters.push('brightness(' + (0.2 + BG_BRIGHTNESS * 0.016) + ')');
  if (BG_BLUR > 0) bgFilters.push('blur(' + (BG_BLUR / 20) + 'px)');
  if (bgFilters.length) bg.style.filter = bgFilters.join(' ');
  document.body.appendChild(bg);
  if (BG_IMAGES.length > 1) {
    /* 多图轮换：先淡出当前图 → 换新图 → 淡入（transition opacity .8s 已有） */
    setInterval(() => {
      bgIdx = (bgIdx + 1) % BG_IMAGES.length;
      bg.style.opacity = 0;
      setTimeout(() => {
        bg.style.backgroundImage = 'url("' + BG_IMAGES[bgIdx] + '")';
        bg.style.opacity = BG_OPACITY / 100;
      }, 800);
    }, Math.max(1, BG_ROTATION_SEC) * 1000);
  }
} else if (BG_COLOR) {
  document.body.style.background = BG_COLOR;
}
const ENDING_TITLE = "__ENDING_TITLE__";   /* 结尾标题（后端注入；空 → 默认「这一季的 N 部」） */
const PROLOGUE_TITLE = "__PROLOGUE_TITLE__";   /* 序言标题（后端注入；空 → 用主标题） */
const ENDING_TEXT = "__ENDING_TEXT__";     /* 结尾致谢（后端注入；空 → 默认「谢谢观看 · 期待下季」） */
/* 显示时长（秒）：开局定格 / 序言 / 详情 / 结尾（后端注入，空 → 默认） */
const OPENING_SEC = Number("__OPENING_SEC__") || 10;
const INTRO_SEC = Number("__INTRO_SEC__") || 5;
const GROUP_SEC = Number("__GROUP_SEC__") || 5;
const DETAIL_SEC = Number("__DETAIL_SEC__") || 10;
const ENDING_SEC = Number("__ENDING_SEC__") || 5;
const OPEN_SPEED = Number("__OPENING_SPEED__") || 50;    /* 开场显影速度 0-100（50 = 当前） */
const END_SPEED = Number("__ENDING_SPEED__") || 50;      /* 结尾滚动速度 0-100（50 = 当前） */
const SP_MULT = (120 - (OPEN_SPEED > 100 ? 50 : OPEN_SPEED)) / 70;   /* 速度→节奏倍数：50→1, 100→~0.29(快), 0→~1.71(慢) */

/* 副题占位：注入为空 → 隐藏 */
(() => { const hs = document.getElementById('heroSub'); if (hs && !hs.textContent.trim()) hs.style.display = 'none'; })();

/* ========== 背景音乐（多曲顺序连续 + 快结束提示下一首） ========== */
const BGM_TRACKS = __BGM_TRACKS__;
if (BGM_TRACKS && BGM_TRACKS.length) {
  const bgmAudio = document.getElementById('bgmAudio');
  const bgmBar = document.getElementById('bgmBar');
  const bgmPlayBtn = document.getElementById('bgmPlayBtn');
  const bgmMuteBtn = document.getElementById('bgmMuteBtn');
  const bgmProg = document.getElementById('bgmProg');
  const bgmTimeEl = document.getElementById('bgmTime');
  const bgmNameEl = document.getElementById('bgmName');
  let bgmIndex = 0, upNext = null;
  bgmBar.hidden = false;
  const fmtT = s => { if (!isFinite(s) || s <= 0) return '0:00'; return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0'); };
  const setPlay = playing => { bgmPlayBtn.textContent = playing ? '❚❚' : '▶'; bgmPlayBtn.title = playing ? '暂停' : '播放'; };
  const updateTime = () => { const d = bgmAudio.duration || 0; bgmProg.style.width = (d ? (bgmAudio.currentTime / d) * 100 : 0) + '%'; bgmTimeEl.textContent = fmtT(bgmAudio.currentTime) + ' / ' + fmtT(d); };
  /* 快结束前 4s 提示下一首：timeupdate 实时检测（data URI 音频 duration 可能迟就绪，setTimeout 排不准） */
  const updateBgmHint = () => {
    const d = bgmAudio.duration || 0;
    const remain = d > 0 ? d - bgmAudio.currentTime : -1;
    if (remain >= 0 && remain <= 4) {
      const n = BGM_TRACKS[(bgmIndex + 1) % BGM_TRACKS.length];
      bgmNameEl.textContent = '即将播放：' + n.name;
      bgmBar.classList.add('next');
    } else {
      bgmNameEl.textContent = BGM_TRACKS[bgmIndex].name;
      bgmBar.classList.remove('next');
    }
  };
  const loadTrack = autoplay => {
    const t = BGM_TRACKS[bgmIndex];
    bgmAudio.src = t.src;
    bgmNameEl.textContent = t.name;         // 播放中始终显示当前曲名
    bgmBar.classList.remove('next');
    bgmProg.style.width = '0%'; bgmTimeEl.textContent = '0:00 / 0:00';
    bgmAudio.load();
    if (!IS_RECORD && autoplay) bgmAudio.play().catch(() => {}).then(() => setPlay(true));
  };
  if (IS_RECORD) {
    /* 录制模式：headless 不真实播放（音轨由 ffmpeg 混入）——隐藏工具栏、定时器模拟进度与切曲 */
    bgmPlayBtn.hidden = true;
    bgmMuteBtn.hidden = true;
    let fakeT = 0;
    setInterval(() => {
      const d = bgmAudio.duration || 180;
      fakeT += 0.1;
      if (fakeT >= d) { fakeT = 0; bgmIndex = (bgmIndex + 1) % BGM_TRACKS.length; loadTrack(false); }
      bgmProg.style.width = (fakeT / d * 100) + '%';
      bgmTimeEl.textContent = fmtT(fakeT) + ' / ' + fmtT(d);
      if (d - fakeT < 4) { bgmNameEl.textContent = '即将播放：' + BGM_TRACKS[(bgmIndex + 1) % BGM_TRACKS.length].name; bgmBar.classList.add('next'); }
      else bgmBar.classList.remove('next');
    }, 100);
    loadTrack(false);
  } else {
    bgmAudio.addEventListener('timeupdate', () => { updateTime(); updateBgmHint(); });
    bgmAudio.addEventListener('loadedmetadata', () => { updateTime(); updateBgmHint(); });
    bgmAudio.addEventListener('ended', () => {
      if (BGM_TRACKS.length > 1) { bgmIndex = (bgmIndex + 1) % BGM_TRACKS.length; loadTrack(true); }
      else { bgmAudio.currentTime = 0; bgmAudio.play().catch(() => {}); }   // 单曲循环
    });
    bgmPlayBtn.addEventListener('click', () => { if (bgmAudio.paused) { bgmAudio.play().catch(() => {}); setPlay(true); } else { bgmAudio.pause(); setPlay(false); } });
    bgmMuteBtn.addEventListener('click', () => { bgmAudio.muted = !bgmAudio.muted; bgmMuteBtn.classList.toggle('muted', bgmAudio.muted); bgmMuteBtn.textContent = bgmAudio.muted ? '🔇' : '♪'; });
    document.getElementById('bgmProgTrack').addEventListener('click', e => { const rect = e.currentTarget.getBoundingClientRect(); if (bgmAudio.duration) bgmAudio.currentTime = ((e.clientX - rect.left) / rect.width) * bgmAudio.duration; });
    loadTrack(true);   // 预览自动播放（浏览器 autoplay 策略可能拦截，拦截则手动点播）
  }
}

/* ========== 星空粒子 ========== */
(() => {
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  let W, H, pts = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 70; i++) pts.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.3 + .4, vy: Math.random() * .18 + .04,
    tw: Math.random() * Math.PI * 2, tws: Math.random() * .02 + .008
  });
  (function draw() {
    ctx.clearRect(0, 0, W, H);
    const hue = [200, 218, 262];
    for (const p of pts) {
      p.y -= p.vy; p.tw += p.tws;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      const a = .35 + Math.sin(p.tw) * .25;
      const h = hue[(Math.random() * hue.length) | 0];
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = `hsla(${h},80%,78%,${a})`; ctx.fill();
    }
    requestAnimationFrame(draw);
  })();
})();

/* ========== 霓虹雾 ========== */
(() => {
  const wrap = document.getElementById('clouds');
  const sizes = [
    { w: 420, h: 160, x: 6, y: 12, s: 15, d: 26 },
    { w: 320, h: 130, x: 74, y: 18, s: 18, d: 32 },
    { w: 520, h: 180, x: 40, y: 68, s: 12, d: 24 },
    { w: 260, h: 110, x: 16, y: 46, s: 22, d: 38 },
    { w: 380, h: 150, x: 64, y: 82, s: 16, d: 30 }
  ];
  for (const c of sizes) {
    const d = document.createElement('div');
    d.className = 'cloud';
    d.style.cssText = `width:${c.w}px;height:${c.h}px;left:${c.x}%;top:${c.y}%;animation-duration:${c.d}s;animation-delay:${-c.s}s;opacity:.55;`;
    wrap.appendChild(d);
  }
})();

/* ========== 暗房闪回开场（封面乱序缓缓浮现） ========== */
const N = SLIDES.length;
const pad = n => String(n).padStart(2, '0');
const darkroom = document.getElementById('darkroom');
const devCount = document.getElementById('devCount');
const devIdx = document.getElementById('devIdx');
const skipBtn = document.getElementById('skipBtn');
const GLOWS = ['#4fc3f7', '#ff8fb8', '#a78bfa', '#ffd166', '#34d399'];
const glowOf = i => GLOWS[i % GLOWS.length];
/* 开场封面大小系数：0-100 滑块（后端注入 __COVER_SIZE__；50 → 1.15 = 中档） */
const COVER_COEF = 0.65 + Number('__COVER_SIZE__') / 100;
const SPOTS = [
  { x:-44, y:-14, s:1.0, r:-7 }, { x:-26, y:-30, s:.64, r: 5 }, { x:-8,  y:-25, s:.92, r:-3 },
  { x: 18, y:-32, s:.6,  r: 9 }, { x: 38, y:-20, s:.86, r:-5 }, { x: 42, y:-6,  s:1.12, r: 3 },
  { x:-42, y: 8,  s:.58, r: 8 }, { x:-28, y: 20, s:1.06, r:-2 }, { x:-10, y: 10, s:.68, r: 6 },
  { x: 14, y: 22, s:.98, r:-4 }, { x: 30, y: 6,  s:.66, r: 7 }, { x: 43, y: 16, s:.9,  r:-6 },
];
/* 无序照片墙：随机撒点（位置/大小/角度各异）+ 最小间距约束（允许少量重叠），
   防止全挤一团；≤12 用上方错落分布 */
function spotsFor(n) {
  if (n <= SPOTS.length) return SPOTS.map(sp => ({ ...sp, s: sp.s * COVER_COEF }));
  const spots = [];
  const W = innerWidth, H = innerHeight;
  const rand = () => Math.random();
  let attempts = 0;
  while (spots.length < n && attempts < n * 60) {
    attempts++;
    const x = (rand() * 2 - 1) * 44;
    const y = (rand() * 2 - 1) * 25;
    const s = COVER_COEF * (0.5 + rand() * 0.6);
    const r = (rand() * 16) - 8;
    const gap = 190 * s * 0.5;
    let ok = true;
    for (const sp of spots) {
      const dx = (sp.x - x) / 100 * W, dy = (sp.y - y) / 100 * H;
      if (Math.hypot(dx, dy) < Math.max(gap, 190 * sp.s * 0.5)) { ok = false; break; }
    }
    if (ok) spots.push({ x, y, s, r });
  }
  while (spots.length < n) {
    spots.push({ x: (rand() * 2 - 1) * 44, y: (rand() * 2 - 1) * 25,
      s: COVER_COEF * (0.5 + rand() * 0.6), r: (rand() * 16) - 8 });
  }
  return spots;
}
/* 开场代表秀：只显影 open 子集（无 open 标记 → 全显） */
const OPENING = SLIDES.some(s => s.open) ? SLIDES.filter(s => s.open) : SLIDES;
const OPENING_SLIDE = OPENING.map(s => SLIDES.indexOf(s));
const OPENING_SPOTS = spotsFor(OPENING.length);
const pols = OPENING.map((s, i) => {
  const p = document.createElement('div');
  p.className = 'card';
  p.style.setProperty('--c1', '#221a3a');
  p.style.setProperty('--c2', '#0d0a18');
  const sp = OPENING_SPOTS[i];
  p.style.transform = `translate(calc(-50% + ${sp.x}vw), calc(-50% + ${sp.y}vh)) scale(${sp.s.toFixed(3)}) rotate(${sp.r}deg)`;
  p.innerHTML = `<div class="cover"><img src="${s.cover}" alt="" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'"></div>`;
  p.style.opacity = '0';
  darkroom.appendChild(p);
  return p;
});
let devTimers = [];
function develop(i, hold) {
  const p = pols[i];
  p.style.opacity = '1';
  p.querySelector('.cover').classList.add('develop');
  devIdx.textContent = pad(i + 1);
  devTimers.push(setTimeout(() => p.querySelector('.cover').classList.add('done'), hold));
}
function playDevelop() {
  devTimers.forEach(clearTimeout); devTimers = [];
  skipBtn.hidden = IS_RECORD;
  devCount.classList.add('show');
  pols.forEach(p => { p.classList.remove('mount'); p.style.opacity = '0';
    p.querySelector('.cover').classList.remove('develop', 'done'); });
  const order = OPENING.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const DUR = 520 * SP_MULT, GAP = 40 * SP_MULT;
  let delay = 0;
  for (const idx of order) { devTimers.push(setTimeout(() => develop(idx, DUR), delay)); delay += DUR + GAP; }
  devTimers.push(setTimeout(openWall, delay + 300));
}
function openWall() {
  devCount.classList.remove('show');
  pols.forEach((p, i) => { p.classList.add('mount'); p.onclick = () => { stopAuto(); goto(OPENING_SLIDE[i]); }; });
  /* 开局定格 OPENING_SEC 后开始自动导览 */
  entryTimer = setTimeout(beginAutoGuide, OPENING_SEC * 1000);
}
function skipFlash() {
  devTimers.forEach(clearTimeout); devTimers = [];
  pols.forEach(p => { p.style.opacity = '1'; p.querySelector('.cover').classList.add('develop', 'done'); });
  openWall();
}
skipBtn.addEventListener('click', skipFlash);

/* ========== 渲染 Story（stream：有 group 插组横幅；无 group 直排） ========== */
const story = document.getElementById('story');
const tbLabel = document.getElementById('tbLabel');
const chip = ([name, n]) => {
  const tier = n >= 10 ? 5 : n >= 7 ? 4 : n >= 4 ? 3 : n >= 2 ? 2 : 1;
  return `<span class="chip s${tier}">${name}</span>`;
};
const items = [];
const hasGroup = SLIDES.some(s => s.group);

/* 封面条自动滚动（未溢出不滚；到底回 0 循环） */
function autoScroll(el, speed) {
  if (!el) return;
  const step = speed || 1;
  setInterval(() => {
    if (el.scrollWidth <= el.clientWidth + 2) return;
    el.scrollLeft += step;
    if (el.scrollLeft >= el.scrollWidth - el.clientWidth) el.scrollLeft = 0;
  }, 35);
}

/* 序言页：主题简介（intro 非空时显示） */
function buildPrologue() {
  const p = document.createElement('section');
  p.className = 'prologue'; p.id = 'item-' + items.length;
  p.innerHTML = `<div class="pl-kicker">PROLOGUE</div>
    <h2>${PROLOGUE_TITLE || document.querySelector('.hero-plate h1').textContent}</h2>
    <p class="pl-text">${INTRO}</p>
    <div class="pl-cta">✦ 向下进入 ✦</div>`;
  story.appendChild(p);
  return p;
}

/* 结尾回顾墙：全部封面缩小铺满 + 致谢 */
function buildEnding() {
  const e = document.createElement('section');
  e.className = 'ending'; e.id = 'item-' + items.length;
  const heading = `<div class="en-kicker">THE END</div>
    <h2>${ENDING_TITLE || '这一季的 ' + N + ' 部'}</h2>`;
  if (hasGroup) {
    /* 分组回顾：所有组全排 + 连续自动滚动（录制无需点击；滚到底停留 ENDING_SEC 后结束，速度 END_SPEED） */
    const gmap = new Map(), groups = [];
    SLIDES.forEach(s => {
      if (!gmap.has(s.group)) { gmap.set(s.group, groups.length); groups.push({ name: s.group, list: [] }); }
      groups[gmap.get(s.group)].list.push(s);
    });
    e.innerHTML = `${heading}
      <div class="en-scroll" id="enScroll"><div class="en-groups">
        ${groups.map(g => `
        <div class="en-group">
          <div class="en-group-name">${g.name} · ${g.list.length} 部</div>
          <div class="en-group-covers">${g.list.map(s => `<img src="${s.cover}" alt="" onerror="this.style.display='none'">`).join('')}</div>
        </div>`).join('')}
      </div></div>`;
    e.querySelectorAll('.en-group-covers').forEach(el => autoScroll(el, 1));
  } else {
    e.innerHTML = `${heading}<div class="en-wall">${SLIDES.map((s, i) => `<img src="${s.cover}" alt="" style="--i:${i % 12}" onerror="this.style.display='none'">`).join('')}</div>`;
  }
  story.appendChild(e);
  return e;
}

function buildStory(s, idx, g, j, total) {
  const sc = document.createElement('section');
  sc.className = 'story-card'; sc.id = 'item-' + items.length;
  if (g) sc.style.setProperty('--cg', glowOf(g.gi));
  const badge = g ? `<span class="group-badge"><span class="p">${g.name}</span> · 第 ${j + 1}/${total} 部</span>` : '';
  sc.innerHTML = `${badge}
    <span class="sc-no">${pad(idx + 1)}</span>
    <div class="sc-poster"><img src="${s.cover}" alt="${s.title}" onerror="this.style.display='none'"></div>
    <div class="sc-info"><span class="kicker">PICK NO.${pad(idx + 1)}</span>
      <h2>${s.title}</h2><p class="note">${s.note || ''}</p>
      <div class="tags">${(s.tags || []).map(chip).join('')}</div></div>`;
  story.appendChild(sc);
  return sc;
}

if (INTRO) items.push({ el: buildPrologue(), type: 'prologue', hold: INTRO_SEC * 1000 });

if (hasGroup) {
  const groups = []; const gmap = new Map();
  SLIDES.forEach(s => {
    if (!gmap.has(s.group)) { gmap.set(s.group, groups.length); groups.push({ name: s.group, list: [], gi: groups.length }); }
    groups[gmap.get(s.group)].list.push(s);
  });
  let idx = 0;
  groups.forEach(g => {
    /* 组横幅 */
    const il = document.createElement('section');
    il.className = 'interlude'; il.id = 'item-' + items.length;
    il.style.setProperty('--cg', glowOf(g.gi));
    il.innerHTML = `<div class="il-left">
        <div class="il-no"><span class="bar"></span>EPISODE ${pad(g.gi + 1)}</div>
        <h2 class="il-title">${g.name}</h2>
        <div class="il-sub">共 <b>${g.list.length}</b> 部</div>
        <span class="il-count">▶ 进入 ${g.name} 组</span></div>
      <div class="il-wall">${g.list.map(s => `<img src="${s.cover}" onerror="this.style.display='none'">`).join('')}</div>`;
    story.appendChild(il);
    items.push({ el: il, type: 'interlude', hold: GROUP_SEC * 1000, group: g.name, gi: g.gi });
    autoScroll(il.querySelector('.il-wall'), 1.2);
    /* 组内 Story */
    g.list.forEach((s, j) => {
      items.push({ el: buildStory(s, idx++, g, j, g.list.length), type: 'story', hold: DETAIL_SEC * 1000, group: g.name, idx: j + 1, total: g.list.length });
    });
  });
} else {
  SLIDES.forEach((s, i) => {
    items.push({ el: buildStory(s, i, null, 0, 0), type: 'story', hold: DETAIL_SEC * 1000, idx: i + 1, total: N });
  });
}
items.push({ el: buildEnding(), type: 'ending', hold: 3600 * 1000, total: N });   // hold 仅兜底；实际结束由 startEnding 滚到底+ENDING_SEC 控制

/* 进入视野 → in-view + trackbar 更新 */
const io = new IntersectionObserver(entries => {
  for (const e of entries) if (e.isIntersecting) {
    e.target.classList.add('in-view');
    const it = items.find(x => x.el === e.target);
    if (it) updateTrackbar(it);
  }
}, { threshold: 0.45 });
items.forEach(it => {
  io.observe(it.el);
  if (it.type === 'story') it.el.onclick = () => { stopAuto(); goto(items.indexOf(it)); };
});

function updateTrackbar(it) {
  if (it.type === 'prologue') { tbLabel.innerHTML = '<b class="cur">序言</b> · 主题概览'; return; }
  if (it.type === 'ending') { tbLabel.innerHTML = `谢谢观看 · 这一季 <b class="cur">${it.total}</b> 部`; return; }
  if (it.type === 'interlude') {
    tbLabel.innerHTML = `<b class="cur">${it.group}</b> · 章节转场`;
  } else if (it.group) {
    tbLabel.innerHTML = `<b class="cur">${it.group}</b> · 第 ${it.idx}/${it.total} 部`;
  } else {
    tbLabel.innerHTML = `第 <b class="cur">${it.idx}</b> 部 / 共 ${it.total} 部`;
  }
}

const tb = document.getElementById('trackbar');
const trackbarIO = new IntersectionObserver(es => {
  for (const e of es) tb.classList.toggle('show', !e.isIntersecting);
}, { threshold: 0 });
trackbarIO.observe(document.querySelector('.hero'));

/* ========== 自动导览 ========== */
const tbBar = document.getElementById('trackbar');
const prog = document.getElementById('tbProg');
const autoBadge = document.getElementById('autoBadge');
const AUTOPLAY_HOLD = 6000;
let entryTimer = null, autoTimer = null, autoIndex = 0, autoplaying = false;

function resetProg() { prog.classList.remove('run'); void prog.offsetWidth; prog.classList.add('run'); }
function beginAutoGuide() {
  if (autoplaying) return;
  autoplaying = true; autoIndex = 0;
  tbBar.classList.add('auto'); autoBadge.hidden = IS_RECORD;
  goto(0); scheduleAuto();
}
function scheduleAuto() {
  resetProg();
  const hold = items[autoIndex].hold;
  autoTimer = setTimeout(() => {
    autoIndex++;
    if (autoIndex >= items.length) { finishAuto(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    goto(autoIndex); scheduleAuto();
  }, hold);
}
function finishAuto() {
  autoplaying = false;
  tbBar.classList.remove('auto'); prog.classList.remove('run'); autoBadge.hidden = true;
  document.documentElement.dataset.tourEnded = '1'; // 录制模式：render.js 检测到此标记即停止抓帧，保证结尾播完
}
function stopAuto() {
  clearTimeout(entryTimer); clearTimeout(autoTimer);
  autoTimer = null; entryTimer = null;
  clearEndingTimers();
  finishAuto();
}
function goto(i) {
  if (autoplaying) resetProg();
  const it = items[i];
  prog.style.animationDuration = (it.hold / 1000) + 's';
  it.el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  if (it.type === 'ending') startEnding();   // 结尾：启动连续滚动/收尾停留（滚到底 + ENDING_SEC → finishAuto）
  updateTrackbar(it);
}
/* 结尾收尾：有分组 → 连续滚动到底后停留 ENDING_SEC；无分组 → 直接停留 ENDING_SEC 结束 */
let endingTimers = [];
function clearEndingTimers() { endingTimers.forEach(t => { clearInterval(t); clearTimeout(t); }); endingTimers = []; }
function startEnding() {
  clearEndingTimers();
  const scrollEl = document.getElementById('enScroll');
  if (!scrollEl) {
    endingTimers.push(setTimeout(finishAuto, ENDING_SEC * 1000));
    return;
  }
  const step = 2 + END_SPEED / 12;   // 速度 0-100 → 2~10px/帧（50 ≈ 6px/帧 ≈ 370px/s）
  const timer = setInterval(() => {
    if (scrollEl.scrollTop + scrollEl.clientHeight >= scrollEl.scrollHeight - 2) {
      clearInterval(timer);
      endingTimers.push(setTimeout(finishAuto, ENDING_SEC * 1000));
      return;
    }
    scrollEl.scrollTop += step;
  }, 16);
  endingTimers.push(timer);
}

if (!IS_RECORD) {
  window.addEventListener('wheel', stopAuto, { passive: true });
  window.addEventListener('touchstart', stopAuto, { passive: true });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') stopAuto();
    const n = items.findIndex(c => c.el.classList.contains('in-view'));
    if (n < 0) return;
    if (e.key === 'ArrowRight') goto(Math.min(n + 1, items.length - 1));
    if (e.key === 'ArrowLeft') goto(Math.max(n - 1, 0));
  });
}

playDevelop();
</script>
</body>
