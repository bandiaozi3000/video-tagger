-width:650px;margin-top:12px;color:var(--muted);font-size:14px;line-height:1.85;white-space:pre-line}.media-window{position:relative;margin-top:28px;aspect-ratio:16/8.5;min-height:180px;border:1px solid rgba(82,226,245,.36);border-radius:18px;overflow:hidden;background:#0b1020;box-shadow:0 16px 44px rgba(0,0,0,.4),0 0 34px rgba(82,226,245,.1)}.media-window video{width:100%;height:100%;display:block;object-fit:cover;background:#0b1020}.media-window:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,5,18,.1),transparent 38%,rgba(2,5,18,.76))}.window-top{position:absolute;z-index:2;left:15px;right:15px;top:13px;display:flex;justify-content:space-between;color:rgba(255,255,255,.72);font:9px var(--mono);letter-spacing:1.5px}.window-top .real{color:var(--pink)}.window-caption{position:absolute;z-index:3;left:15px;right:15px;bottom:14px;display:flex;justify-content:space-between;align-items:end;gap:12px}.badge-line{max-width:78%;padding:7px 11px;border-left:2px solid var(--cyan);background:rgba(4,7,18,.66);backdrop-filter:blur(9px);font-size:12px;line-height:1.45}.badge-line b{color:var(--cyan)}.badge-line small{display:block;margin-top:2px;color:var(--muted);font:10px var(--mono)}.clip-count{color:rgba(255,255,255,.7);font:10px var(--mono);white-space:nowrap}.window-progress{position:absolute;z-index:4;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.15)}.window-progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 10px var(--cyan)}.clip-rail{display:flex;gap:8px;overflow-x:auto;padding:10px 1px 2px;scrollbar-width:thin}.clip-rail button{flex:none;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.035);color:var(--muted);cursor:pointer;font-size:11px;transition:.2s}.clip-rail button:hover,.clip-rail button.active{border-color:rgba(82,226,245,.7);background:rgba(82,226,245,.13);color:#fff}.clip-rail .n{margin-right:6px;color:var(--cyan);font:10px var(--mono)}.static-window{display:grid;place-items:center;min-height:180px;margin-top:28px;border:1px dashed rgba(255,255,255,.2);border-radius:18px;background:rgba(255,255,255,.025);text-align:center;color:var(--faint)}.static-window strong{display:block;margin-bottom:8px;color:var(--muted);font-size:15px}.info-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:17px;color:var(--muted);font-size:12px}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tag{padding:5px 9px;border:1px solid rgba(82,226,245,.28);border-radius:99px;background:rgba(82,226,245,.08);color:var(--cyan);font-size:10px}.tag:nth-child(2n){border-color:rgba(255,91,154,.28);background:rgba(255,91,154,.08);color:#ff9cbd}
.ending{text-align:center}.ending:before{background:radial-gradient(ellipse,rgba(255,91,154,.13),transparent 68%)}.ending h2{background:linear-gradient(110deg,#fff,var(--pink),var(--amber))}.ending p{margin-top:15px;color:var(--muted);letter-spacing:2px}.ending-stats{display:flex;justify-content:center;gap:10px;margin:28px 0}.ending-wall{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;max-width:880px;margin:28px auto 0}.ending-wall img{width:68px;height:96px;object-fit:cover;border:1px solid rgba(255,255,255,.15);border-radius:9px;box-shadow:0 10px 25px rgba(0,0,0,.4)}.track{position:fixed;z-index:40;left:50%;bottom:21px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;width:min(720px,calc(100% - 34px));padding:11px 15px;border:1px solid var(--line);border-radius:16px;background:rgba(10,13,28,.82);backdrop-filter:blur(18px);box-shadow:0 15px 50px rgba(0,0,0,.42);font-size:11px;color:var(--muted)}.track b{color:#fff}.track-line{height:3px;flex:1;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}.track-line i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--pink));transform-origin:left}.track-line.run i{animation:fill var(--hold,8s) linear forwards}@keyframes fill{to{width:100%}}.track-actions{display:flex;gap:9px}.track-actions button{border:0;background:none;color:var(--muted);cursor:pointer}.track-actions button:hover{color:var(--cyan)}.bgm{position:fixed;z-index:41;left:15px;bottom:8%;display:flex;align-items:center;gap:8px;color:var(--muted);font:11px var(--mono);text-shadow:0 1px 10px #000}.bgm[hidden]{display:none}.bgm button{border:0;background:none;color:inherit;cursor:pointer}.bgm span{max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.side{position:fixed;z-index:40;right:16px;top:50%;display:flex;flex-direction:column;gap:7px;transform:translateY(-50%)}.side[hidden]{display:none}.side button{border:0;background:none;color:var(--faint);cursor:pointer;f <div class="ambient"><i></i><i></i><i></i></div>
<main class="shell">
<header class="topbar"><div class="brand"><span class="brand-mark">✦</span><span>__BRAND_TITLE__ / CLIP REEL</span></div><div class="live"><i></i><span>PREVIEW · v0.21</span></div></header>
<section class="hero" id="hero"><div class="hero-copy"><div class="eyebrow">A CURATED SEASON · BEFORE THE REEL</div><h1>__TITLE__<em>让喜欢开始播放</em></h1><p class="hero-sub" id="heroSub">__SUBTITLE__</p><div class="hero-meta"><div class="metric"><b id="mediaTotal">0</b><span>MEDIA PICKS</span></div><div class="metric"><b id="clipTotal">0</b><span>REAL CLIPS</span></div><div class="metric"><b id="groupTotal">0</b><span>COLLECTIONS</span></div></div><div class="hero-cta">SCROLL TO ENTER · 观前速览</div></div><div class="overview-wall" id="openingWall"></div></section>
<main id="stages"></main>
<div class="track" id="track"><span id="trackLabel">观前速览</span><div class="track-line"><i id="trackProgress"></i></div><div class="track-actions"><button id="autoToggle" type="button">❚❚ 自动导览</button><button id="topBtn" type="button">↑</button></div></div>

<script>
const SLIDES=__SLIDES_JSON__,IS_RECORD=new URLSearchParams(location.search).get('record')==='1';
const INTRO="__INTRO__",PROLOGUE_TITLE="__PROLOGUE_TITLE__",ENDING_TITLE="__ENDING_TITLE__",ENDING_TEXT="__ENDING_TEXT__",DETAIL_SHOW=__DETAIL_SHOW__;
const BG_IMAGES=__BG_IMAGES__,BG_COLOR="__BG_COLOR__";
const BG_ROTATION_SEC=Number("__BG_ROTATION_SEC__")||8,BG_OPACITY=Number("__BG_OPACITY__"),BG_BLUR=Number("__BG_BLUR__"),BG_BRIGHTNESS=Number("__BG_BRIGHTNESS__");
if(Array.isArray(BG_IMAGES)&&BG_IMAGES.length){let bgIndex=0;const bg=document.createElement('div');bg.style.cssText='position:fixed;inset:0;z-index:-1;background:center/cover no-repeat url("'+BG_IMAGES[0]+'");pointer-events:none;transition:opacity .8s';bg.style.opacity=(Number.isFinite(BG_OPACITY)?BG_OPACITY:100)/100;const filters=[];if(Number.isFinite(BG_BRIGHTNESS)&&BG_BRIGHTNESS!==50)filters.push('brightness('+(0.2+BG_BRIGHTNESS*.016)+')');if(Number.isFinite(BG_BLUR)&&BG_BLUR>0)filters.push('blur('+(BG_BLUR/20)+'px)');if(filters.length)bg.style.filter=filters.join(' ');document.body.appendChild(bg);if(BG_IMAGES.length>1)setInterval(()=>{bg.style.opacity=0;bgIndex=(bgIndex+1)%BG_IMAGES.length;setTimeout(()=>{bg.style.backgroundImage='url("'+BG_IMAGES[bgIndex]+'")';bg.style.opacity=(Number.isFinite(BG_OPACITY)?BG_OPACITY:100)/100},800)},Math.max(1,BG_ROTATION_SEC)*1000)}else if(BG_COLOR)document.body.style.background=BG_COLOR;
const N=SLIDES.length,pad=n=>String(n).padStart(2,'0'),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const OPENING_SEC=Number("__OPENING_SEC__")||10,INTRO_SEC=Number("__INTRO_SEC__")||5,DETAIL_SEC=Number("__DETAIL_SEC__")||10,ENDING_SEC=Number("__ENDING_SEC__")||5,END_SPEED=Number("__ENDING_SPEED__")||50;
const allClips=SLIDES.reduce((n,s)=>n+(Array.isArray(s.clips)?s.clips.length:0),0),groups=[...new Set(SLIDES.map(s=>s.group).filter(Boolean))],OPENING=SLIDES.some(s=>s.open)?SLIDES.filter(s=>s.open):SLIDES;document.getElementById('clipTotal').textContent=allClips;document.getElementById('groupTotal').textContent=groups.length||1;
const sub=document.getElementById('heroSub');if(!sub.textContent.trim())sub.hidden=true;
const wall=document.getElementById('openingWall');wall.innerHTML=OPENING.map((s,i)=>`<img loading="lazy" style="--i:${i%5}" src="${esc(s.cover)}" alt="${esc(s.title)}" onerror="this.style.display='none'">`).join('');
const stages=document.getElementById('stages'),items=[];let currentIndex=0,autoPlaying=true,autoTimer=null;
function chip(name){return `<span class="tag">${esc(name)}</span>`}
function badgeText(slide,clip,i){const b=clip.badge||{},p=[];if(b.mediaTitle)p.push(slide.title);if(b.clipTitle)p.push(clip.title||'未命名片段');if(b.index)p.push('#'+(i+1));if(b.note&&clip.note)p.push(clip.note);let t=p.join(' · ');if(b.custom)t+=(t?' · ':'')+String(b.custom).replaceAll('{media}',slide.title||'').replaceAll('{clip}',clip.title||'未命名片段').replaceAll('{i}',String(i+1));return t||clip.title||'片段'}
function clipHold(s){const cs=Array.isArray(s.clips)?s.clips:[];const known=cs.reduce((n,c)=>n+(c.startSec!=null&&c.endSec!=null?Math.max(0,c.endSec-c.startSec):0),0);return Math.max(DETAIL_SEC,known+(cs.some(c=>c.endSec==null)?2:0))*1000}
function makePrologue(){if(!INTRO.trim())return null;const e=document.createElement('section');e.className='section prologue';e.innerHTML=`<div class="prologue-inner"><div class="section-kicker">PROLOGUE · 前言</div><h2>${esc(PROLOGUE_TITLE||document.title)}</h2><p>${esc(INTRO)}</p><div class="hint">✦ 向下进入放映 ✦</div></div>`;stages.appendChild(e);return e}
function makeReel(s,i){const e=document.createElement('section'),cs=Array.isArray(s.clips)?s.clips:[];e.className='section';const group=s.group?`<span class="group-label">${esc(s.group)}</span>`:'';const tags=DETAIL_SHOW.tag&&(s.tags||[]).length?`<div class="tags">${s.tags.map(x=>chip(x)).join('')}</div>`:'';const flag=DETAIL_SHOW.status&&s.flag?`<span class="flag">${esc(s.flag)}</span>`:'';e.innerHTML=`<article class="reel ${cs.length?'':'no-clips'}"><div class="poster">${flag}<img loading="lazy" src="${esc(s.cover)}" alt="${esc(s.title)}" onerror="this.style.display='none'"><div class="poster-caption"><small>PICK NO.${pad(i+1)}</small><b>${esc(s.title)}</b></div></div><div class="reel-content"><div class="reel-head"><span class="reel-index">MEDIA ${pad(i+1)} / ${pad(N)}</span>${group}</div><h2>${esc(s.title)}</h2>${DETAIL_SHOW.note&&s.note?`<p class="reel-note">${esc(s.note)}</p>`:''}${cs.length?`<div class="media-window" data-reel><video muted playsinline preload="metadata"></video><div class="window-top"><span class="real">● REAL CLIP / PLAYING</span><span class="clip-count"></span></div><div class="window-caption"><div class="badge-line"></div></div><div class="window-progress"><i></i></div></div><div class="clip-rail">${cs.map((c,j)=>`<button type="button" data-clip="${j}"><span class="n">${pad(j+1)}</span>${esc(c.title||'未命名片段')}</button>`).join('')}</div>`:`<div class="static-window"><div><strong>此媒体未选择推荐片段</strong><span>保留静态作品卡 · 可在推荐向导中添加</span></div></div>`}<div class="info-row"><span>${esc(s.year||'')} ${esc(s.mediaType||'')}</span>${s.note&&DETAIL_SHOW.note?'<span>·</span><span>推荐媒体</span>':''}</div>${tags}</div></article>`;stages.appendChild(e);if(cs.length)bindReel(e,s,cs);return e}
function bindReel(section,slide,clips){const reel=section.querySelector('[data-reel]'),video=reel.querySelector('video'),caption=reel.querySelector('.badge-line'),count=reel.querySelector('.clip-count'),bar=reel.querySelector('.window-progress i'),buttons=[...section.querySelectorAll('[data-clip]')];let idx=0;function select(next,play){idx=Math.max(0,Math.min(clips.length-1,next));const c=clips[idx];video.src=c.path;video.load();caption.innerHTML=`★ <b>${esc(badgeText(slide,c,idx))}</b><small>REAL CLIP · ${c.startSec==null?'自然结束':'时间段'}</small>`;count.textContent=pad(idx+1)+' / '+pad(clips.length);buttons.forEach((b,j)=>b.classList.toggle('active',j===idx));bar.style.width='0%';if(play)video.play().catch(()=>{})}video.addEventListener('timeupdate',()=>{bar.style.width=video.duration?`${video.currentTime/video.duration*100}%`:'0%'});video.addEventListener('ended',()=>{if(idx+1<clips.length)select(idx+1,true)});buttons.forEach((b,j)=>b.addEventListener('click',ev=>{ev.stopPropagation();select(j,true);autoPlaying=false;clearTimeout(autoTimer)}));select(0,false)}
const pro=makePrologue();if(pro)items.push({el:pro,type:'prologue',hold:INTRO_SEC*1000});SLIDES.forEach((s,i)=>{const e=makeReel(s,i);items.push({el:e,type:'media',hold:clipHold(s),i})});
function makeEnding(){const e=document.createElement('section');e.className='section ending';const title=ENDING_TITLE||'这一季的 '+N+' 部';e.innerHTML=`<div class="ending-inner"><div class="section-kicker">THE END · 放映回顾</div><h2>${esc(title)}</h2><p>${esc(ENDING_TEXT||'谢谢观看 · 期待下一次分享')}</p><div class="ending-stats"><div class="metric"><b>${N}</b><span>MEDIA</span></div><div class="metric"><b>${allClips}</b><span>CLIPS</span></div></div><div class="ending-wall">${SLIDES.map((s,i)=>`<img loading="lazy" style="--i:${i%5}" src="${esc(s.cover)}" alt="${esc(s.title)}" onerror="this.style.display='none'">`).join('')}</div><div class="hint">END OF REEL · THANK YOU</div></div>`;stages.appendChild(e);return e}const ending=makeEnding();items.push({el:ending,type:'ending',hold:ENDING_SEC*1000});
const side=document.getElementById('side');const sections=[{name:'速览',el:document.getElementById('hero')}].concat(items.map(it=>({name:it.type==='prologue'?'前言':it.type==='ending'?'结尾':'媒体 '+pad(it.i+1),el:it.el})));side.innerHTML=sections.map((x,i)=>`<button type="button" data-i="${i}">${x.name}</button>`).join('');side.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{stopAuto();sections[Number(b.dataset.i)].el.scrollIntoView({behavior:'smooth'})}));
function setCurrent(n){currentIndex=n;const it=items[n];document.getElementById('trackLabel').innerHTML=it?it.type==='ending'?'<b>结尾</b> · 总览':it.type==='prologue'?'<b>前言</b> · 主题概览':`第 <b>${it.i+1}</b> 部 / 共 ${N} 部`:'观前速览';side.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===n+1));const line=document.getElementById('trackProgress');line.style.setProperty('--hold',(it?it.hold/1000:OPENING_SEC)+'s');line.parentElement.parentElement.classList.toggle('run',autoPlaying)}
const observer=new IntersectionObserver(es=>es.forEach(x=>{if(!x.isIntersecting)return;const n=items.findIndex(it=>it.el===x.target);if(n>=0)setCurrent(n)}),{threshold:.5});items.forEach(it=>observer.observe(it.el));
function goto(n){if(n<0||n>=items.length)return;items[n].el.scrollIntoView({behavior:'smooth',block:'start'});setCurrent(n)}function finishAuto(){autoPlaying=false;document.getElementById('track').classList.remove('run');if(IS_RECORD){const rem=typeof window.__bgmRemainSec==='function'?window.__bgmRemainSec():0;setTimeout(()=>{document.documentElement.dataset.tourEnded='1'},Math.max(0,rem)*1000+800)}}function schedule(){clearTimeout(autoTimer);if(!autoPlaying)return;const n=currentIndex+1;if(n>=items.length){finishAuto();return}autoTimer=setTimeout(()=>{goto(n);schedule()},items[currentIndex]?.hold||OPENING_SEC*1000)}function startAuto(){autoPlaying=true;document.getElementById('track').classList.add('run');if(currentIndex<0){goto(0);return}schedule()}function stopAuto(){autoPlaying=false;clearTimeout(autoTimer);document.getElementById('track').classList.remove('run')}
document.getElementById('autoToggle').addEventListener('click',()=>{if(autoPlaying)stopAuto();else startAuto()});document.getElementById('topBtn').addEventListener('click',()=>{stopAuto();document.getElementById('hero').scrollIntoView({behavior:'smooth'})});window.addEventListener('message',e=>{if(e.data?.type==='bgm-config')side.hidden=!e.data.enable;if(e.data?.type==='bgm-autoplay'){if(e.data.on)startAuto();else stopAuto()}});window.addEventListener('wheel',()=>{if(!IS_RECORD)stopAuto()},{passive:true});window.addEventListener('touchstart',()=>{if(!IS_RECORD)stopAuto()},{passive:true});
const BGM_TRACKS=__BGM_TRACKS__;
const BGM_TRACK_DURS = __BGM_TRACK_DURS__;
const bgm=document.getElementById('bgm'),audio=document.getElementById('bgmAudio');
const BGM_X=Number("__BGM_X__"),BGM_Y=Number("__BGM_Y__"),BGM_SCALE=Number("__BGM_SCALE__");if(Number.isFinite(BGM_X))bgm.style.left=BGM_X+'%';if(Number.isFinite(BGM_Y))bgm.style.bottom=BGM_Y+'%';if(Number.isFinite(BGM_SCALE))bgm.style.transform='scale('+(BGM_SCALE/100)+')';if(Array.isArray(BGM_TRACKS)&&BGM_TRACKS.length){bgm.hidden=false;let bi=0;const name=document.getElementById('bgmName');const toggle=document.getElementById('bgmToggle');function loadBgm(play){const t=BGM_TRACKS[bi];name.textContent=t.name||'BGM';if(IS_RECORD||!t.src)return;audio.src=t.src;audio.load();if(play)audio.play().catch(()=>{})}toggle.addEventListener('click',()=>{if(audio.paused){audio.play().catch(()=>{});toggle.textContent='❚❚'}else{audio.pause();toggle.textContent='▶'}});audio.addEventListener('ended',()=>{bi=(bi+1)%BGM_TRACKS.length;loadBgm(true)});if(IS_RECORD){const durs=BGM_TRACK_DURS;const start=performance.now();window.__bgmRemainSec=()=>{if(!Array.isArray(durs)||!durs.length)return 0;const total=durs.reduce((a,b)=>a+b,0),p=(performance.now()-start)/1000%total;let a=0;for(const d of durs){if(p<a+d)return a+d-p;a+=d}return 0};loadBgm(false)}else loadBgm(true)}
setCurrent(-1);setTimeout(()=>{document.getElementById('hero').scrollIntoView({behavior:'auto'});setTimeout(startAuto,OPENING_SEC*1000)},120);if(IS_RECORD)document.querySelectorAll('img').forEach(i=>i.loading='eager');
</script>
</body></html>
