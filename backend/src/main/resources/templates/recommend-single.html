<style>

*{box-sizing:border-box}html{scroll-behavior:smooth;background:var(--bg)}body{margin:0;color:var(--ink);font-family:var(--body);background:var(--bg);overflow-x:hidden}button{font:inherit;color:inherit}button:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}body:before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.1;background-image:radial-gradient(rgba(255,255,255,.7) .45px,transparent .45px);background-size:5px 5px;mix-blend-mode:soft-light}.page{position:relative;isolation:isolate;min-height:100vh}.page:before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(105deg,rgba(9,11,16,.98) 12%,rgba(9,11,16,.73) 53%,rgba(9,11,16,.94)),var(--cover) center/cover fixed;filter:saturate(.68)}.page:after{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,rgba(9,11,16,.12),var(--bg) 50%,var(--bg) 100%);pointer-events:none}

(137,231,215,.08);transform:translateX(-3px)}.clip-button.missing{opacity:.58}.clip-button img{width:66px;height:43px;object-fit:cover;background:#171b20}.clip-button b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.clip-button small{display:block;margin-top:5px;color:var(--faint);font:9px var(--mono);line-height:1.35}.clip-button i{color:var(--gold);font:9px var(--mono);font-style:normal}.chapters{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chapter{padding:6px 9px;border-left:2px solid var(--gold);color:var(--muted);background:rgba(241,200,115,.06);font:10px var(--mono)}.chapter.active{color:var(--gold);border-left-color:var(--cyan)}.missing-note{margin-top:15px;color:var(--danger);font-size:11px}.missing-note[hidden]{display:none}
.recap{background:linear-gradient(180deg,rgba(9,11,16,.94),var(--bg-soft))}.recap-inner{text-align:center}.recap h2{font:700 clamp(35px,5.8vw,72px)/1 var(--display)}.recap-sub{max-width:700px;margin:14px auto 0;color:var(--muted);font-size:14px;line-height:1.7}.recap-wall{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;max-width:880px;margin:30px auto 0}.recap-card{position:relative;aspect-ratio:3/4;overflow:hidden;border:1px solid var(--line);background:linear-gradient(145deg,#172b2c,#211521)}.recap-card img{width:100%;height:100%;object-fit:cover;transition:.5s}.recap-card:hover img{transform:scale(1.08)}.recap-card span{position:absolute;left:8px;right:8px;bottom:8px;text-align:left;color:#fff;text-shadow:0 2px 8px #000;font:9px var(--mono)}.recap-actions{display:flex;justify-content:center;gap:9px;margin-top:29px}.control{padding:9px 14px;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer}.control.primary{border-color:var(--cyan);color:var(--cyan);background:rgba(137,231,215,.08)}.footer-track{position:fixed;z-index:40;left:50%;bottom:17px;transform:translateX(-50%);display:flex;align-items:center;gap:11px;width:min(620px,calc(100% - 30px));padding:9px 13px;border:1px solid var(--line);background:rgba(9,13,18,.86);backdrop-filter:blur(18px);font:9px var(--mono);color:var(--muted)}.footer-track b{color:var(--ink)}.trackline{height:2px;flex:1;background:rgba(255,255,255,.18)}.trackline i{display:block;width:25%;height:100%;background:var(--cyan);transition:width .2s}.footer-track button{border:0;background:none;color:var(--muted);cursor:pointer}.footer-track button:hover{color:var(--cyan)}
@media(max-width:820px){.nav{padding:15px 18px}.nav-state{display:none}.hero{min-height:auto;grid-template-columns:1fr;gap:39px;padding:105px 22px 68px}.hero-poster{justify-self:center;width:min(72vw,300px)}.hero h1{font-size:54px}.hook{font-size:17px}.section{padding:74px 22px}.section-head{display:block}.section-note{text-align:left;margin-top:12px}.profile-grid,.moment-layout{grid-template-columns:1fr}.stage{min-height:0}.clip-list{display:grid;grid-template-columns:1fr 1fr;max-height:none}.clip-button{grid-template-columns:1fr;padding:7px}.clip-button img{width:100%;height:auto;aspect-ratio:16/9}.clip-button i{display:none}.recap-wall{grid-template-columns:repeat(3,1fr)}.stage-caption{left:13px;right:13px;bottom:15px;max-width:87%}.stage-caption b{font-size:15px}.footer-track{bottom:10px}}
</style>
</head>
<body>
<div class="page" id="page">
<header class="nav"><div class="brand"><span class="mark">✦</span><span>MEDIA RECOMMEND / SINGLE</span></div><span class="nav-state">READY TO PLAY</span></header>
<section class="hero" id="top"><div class="hero-copy"><div class="eyebrow">A CURATED MEDIA RECOMMENDATION</div><h1 id="heroTitle"></h1><p class="hook" id="hook"></p><div class="hero-meta" id="heroMeta"></div><a class="enter" href="#profile"><i></i> ENTER THE STORY</a></div><figure class="hero-poster"><img id="heroCover" alt="媒体封面"><div class="poster-copy"><small>WORK PROFILE / 01</small><b id="posterTitle"></b></div></figure></section>
<section class="section profile" id="profile"><div class="inner"><div class="section-head"><div><div class="section-kicker">WORK PROFILE</div><h2>先认识这部作品</h2></div><div class="section-note">从作品本身开始，再进入你选出的关键时刻。</div></div><div class="profile-grid"><div><p id="description" class="description"></p><div class="tag-row" id="tags"></div></div><div class="facts" id="facts"></div></div></div></section>
<section class="section moments" id="moments"><div class="inner"><div class="section-head"><div><div class="section-kicker">SELECTED MOMENTS</div><h2>从这些片段开始</h2></div><div class="section-note">片段按制作稿顺序呈现。标题和集号只负责把你带入画面。</div></div><div class="moment-layout"><div class="stage"><video id="player" muted playsinline controls preload="metadata"></video><div id="stageEmpty" class="stage-empty"><div><strong>暂时没有可播放片段</strong><span>已选内容仍保留在右侧清单中。</span></div></div><div class="stage-top"><strong id="stageState">● REAL CLIP</strong><span id="clipCounter">00 / 00</span></div><div class="stage-caption"><small id="clipEpisode"></small><b id="clipTitle">选择一个片段开始</b><em id="clipNote"></em></div><div class="stage-progress"><i id="progress"></i></div></div><div><div class="clip-list" id="clipList"></div><div class="chapters" id="chapters"></div><div class="missing-note" id="missingNote" hidden></div></div></div></div></section>
<section class="section recap" id="recap"><div class="inner recap-inner"><div class="section-kicker">RECOMMENDATION RECAP</div><h2>留下这部作品的几个瞬间</h2><p class="recap-sub" id="recapSub"></p><div class="recap-wall" id="recapWall"></div><div class="recap-actions"><button class="control" data-scroll="#top">↑ 回到开头</button><button class="control primary" id="playAgain">重新播放片段</button></div></div></section>
<div class="footer-track"><span id="trackLabel"><b>01</b> / PROFILE</span><div class="trackline"><i id="trackLine"></i></div><button data-scroll="#top">TOP</button><button id="muteToggle">声音关</button></div>
</div>
<script>
const DATA=__SINGLE_DATA__,esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),el=id=>document.getElementById(id),items=Array.isArray(DATA.items)?DATA.items:[],ready=items.filter(x=>x.sourceReady&&x.sourceUrl),cover=DATA.cover||'';
if(cover){el('page').style.setProperty('--cover','url("'+String(cover).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'")');el('heroCover').src=cover}else el('heroCover').hidden=true;
el('posterTitle').textContent=DATA.title||'单媒体推荐';el('heroTitle').innerHTML=esc(DATA.title||'单媒体推荐')+'<span>值得从哪里开始</span>';el('hook').textContent=items.length?`从你选出的 ${items.length} 个片段开始，认识这部作品最有辨识度的时刻。`:'先从作品档案开始，等你选出值得留下的片段。';
const episodes=[...new Set(items.map(x=>x.episodeNo).filter(x=>x!=null))],meta=[];if(DATA.year)meta.push('<span><strong>'+esc(DATA.year)+'</strong> · '+esc(DATA.format||'视频')+'</span>');if(DATA.season&&DATA.season>1)meta.push('<span>第 '+esc(DATA.season)+' 季</span>');meta.push('<span><strong>'+items.length+'</strong> 个片段</span>');if(episodes.length)meta.push('<span><strong>'+episodes.length+'</strong> 集</span>');el('heroMeta').innerHTML=meta.join('');
const description=DATA.description||'';el('description').textContent=description||'这部作品还没有外部简介，先从你选择的片段开始认识它。';if(!description)el('description').classList.add('empty');el('tags').innerHTML=(DATA.tags||[]).map(x=>'<span class="tag">'+esc(x)+'</span>').join('');const seconds=items.reduce((n,x)=>n+(Number(x.duration)||0),0),time=s=>String(Math.floor((Number(s)||0)/60)).padStart(2,'0')+':'+String(Math.floor((Number(s)||0)%60)).padStart(2,'0');el('facts').innerHTML='<div class="fact"><b>'+items.length+'</b><small>SELECTED CLIPS</small></div><div class="fact"><b>'+episodes.length+'</b><small>EPISODES</small></div><div class="fact"><b>'+time(seconds)+'</b><small>ESTIMATED LENGTH</small></div><div class="fact"><b>1080P</b><small>DEFAULT OUTPUT</small></div>';
const list=el('clipList'),player=el('player'),empty=el('stageEmpty'),caption=el('clipTitle'),note=el('clipNote'),episode=el('clipEpisode'),counter=el('clipCounter'),bar=el('progress'),state=el('stageState');let current=-1;
function label(x){return (x.episodeNo==null?'未编号':('第 '+x.episodeNo+' 集'))+' · '+(x.title||'未命名片段')}
function select(index,play){current=index;const x=items[index];if(!x)return;const canPlay=Boolean(x.sourceReady&&x.sourceUrl);list.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===index));counter.textContent=String(index+1).padStart(2,'0')+' / '+String(items.length).padStart(2,'0');episode.textContent=x.episodeNo==null?'未编号':('EPISODE '+String(x.episodeNo).padStart(2,'0'));caption.textContent=x.title||'未命名片段';note.textContent=x.note||x.sourceMessage||'';bar.style.width='0%';if(canPlay){empty.hidden=true;player.hidden=false;state.textContent='● REAL CLIP';player.src=x.sourceUrl;player.load();if(play)player.play().catch(()=>{})}else{player.pause();player.removeAttribute('src');player.load();player.hidden=true;empty.hidden=false;state.textContent='○ SOURCE MISSING'}}
items.forEach((x,i)=>{const b=document.createElement('button');b.type='button';b.className='clip-button'+(x.sourceReady?'':' missing');const poster=x.poster||cover;b.innerHTML=(poster?'<img src="'+esc(poster)+'" alt="">':'<span></span>')+'<span><b></b><small></small></span><i>'+String(i+1).padStart(2,'0')+'</i>';b.querySelector('b').textContent=x.title||'未命名片段';b.querySelector('small').textContent=label(x)+(x.sourceReady?' · '+time(x.duration):' · '+(x.sourceMessage||'素材未就绪'));b.addEventListener('click',()=>select(i,true));list.appendChild(b)});if(items.length)select(0,false);else{player.hidden=true;empty.hidden=false}
player.addEventListener('timeupdate',()=>{bar.style.width=player.duration?player.currentTime/player.duration*100+'%':'0%'});player.addEventListener('ended',()=>{if(current+1<items.length)select(current+1,true)});
const chapterMap=[];items.forEach((x,i)=>{const key=x.episodeNo==null?'未编号':String(x.episodeNo);if(!chapterMap.some(c=>c.key===key))chapterMap.push({key,label:x.episodeNo==null?'未编号':'第 '+x.episodeNo+' 集',first:i})});el('chapters').innerHTML=chapterMap.length>1?chapterMap.map((c,i)=>'<span class="chapter" data-chapter="'+c.first+'">'+esc(c.label)+'</span>').join(''):'';el('chapters').querySelectorAll('[data-chapter]').forEach(c=>c.addEventListener('click',()=>select(Number(c.dataset.chapter),true)));function syncChapter(){el('chapters').querySelectorAll('.chapter').forEach(c=>c.classList.remove('active'));const x=items[current];const c=chapterMap.find(y=>String(y.key)===(x?.episodeNo==null?'未编号':String(x.episodeNo)));if(c)el('chapters').querySelector('[data-chapter="'+c.first+'"]').classList.add('active')}const oldSelect=select;select=(i,p)=>{oldSelect(i,p);syncChapter()};if(items.length)select(0,false);
const missing=items.length-ready.length;if(missing)el('missingNote').hidden=false,el('missingNote').textContent=missing+' 个已选片段暂时没有可播放素材，仍保留在推荐清单中。';el('recapSub').textContent=(DATA.title||'这部作品')+' · '+items.length+' 个片段 · '+(episodes.length||1)+' 个关键时刻';el('recapWall').innerHTML=items.slice(0,6).map((x,i)=>'<div class="recap-card">'+(x.poster?'<img src="'+esc(x.poster)+'" alt="">':'')+'<span>'+String(i+1).padStart(2,'0')+' / '+esc(x.title||'SELECTED MOMENT')+'</span></div>').join('')+(cover?'<div class="recap-card"><img src="'+esc(cover)+'" alt=""><span>MEDIA PROFILE</span></div>':'');
document.querySelectorAll('[data-scroll]').forEach(b=>b.addEventListener('click',()=>document.querySelector(b.dataset.scroll).scrollIntoView({behavior:'smooth'})));el('muteToggle').addEventListener('click',e=>{player.muted=!player.muted;e.currentTarget.textContent=player.muted?'声音关':'声音开'});el('playAgain').addEventListener('click',()=>{document.querySelector('#moments').scrollIntoView({behavior:'smooth'});setTimeout(()=>{if(items.length)select(0,true)},500)});
const sections=['top','profile','moments','recap'];const names=['PROFILE','PROFILE','MOMENTS','RECAP'];const observer=new IntersectionObserver(entries=>entries.forEach(x=>{if(!x.isIntersecting)return;const i=sections.indexOf(x.target.id);el('trackLabel').innerHTML='<b>'+String(i+1).padStart(2,'0')+'</b> / '+names[i];el('trackLine').style.width=(i+1)*25+'%'}),{threshold:.5});sections.forEach(id=>observer.observe(el(id)));
</script>
