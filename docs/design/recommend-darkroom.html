<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧场 · 此刻</title>
<style>
  /* ============ 深夜霓虹 · 暗房闪回开场（深色暗房版推荐导出模板） ============
     开头：12 张宝丽来相纸在夜空中逐张"快门闪回"显影（灰阶→彩色注入）
     显影完定格 → 自动导览逐部滚入 Story 详解
     ?record=1 为视频渲染录制模式：忽略交互打断，全程自动导览 */
  :root{
    --bg-0:#07060d;
    --bg-1:#100e1e;
    --bg-2:#191428;
    --ink:#ece9f6;
    --muted:#9d97b8;
    --faint:#6b6690;
    --sky:#4fc3f7;
    --blue:#6f8bff;
    --pink:#ff8fb8;
    --gold:#ffd166;
    --line:rgba(255,255,255,.09);
    --card:rgba(20,16,38,.72);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-snap-type:y proximity}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",-apple-system,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(79,195,247,.16), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(111,139,255,.13), transparent 60%),
      radial-gradient(700px 500px at 50% 120%, rgba(100,130,255,.10), transparent 65%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,#0a0916);
    min-height:100vh;position:relative;overflow-x:hidden;
  }
  /* 星空粒子画布 */
  #stars{position:fixed;inset:0;pointer-events:none;opacity:.85;z-index:0}
  /* 顶部霓虹光带 */
  body::before{
    content:"";position:fixed;left:-10%;right:-10%;top:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--sky),var(--blue),var(--pink),transparent);
    filter:blur(.5px);opacity:.9;z-index:2;animation:topline 9s ease-in-out infinite;
  }
  @keyframes topline{0%,100%{opacity:.5}50%{opacity:1}}
  .cloud{
    position:fixed;border-radius:50%;z-index:1;pointer-events:none;
    background:radial-gradient(circle,rgba(111,139,255,.34) 0%,rgba(111,139,255,0) 70%);
    filter:blur(26px);animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translate3d(-4vw,2vh,0) scale(1)}
    50%{transform:translate3d(4vw,-3vh,0) scale(1.08)}
    100%{transform:translate3d(-4vw,2vh,0) scale(1)}
  }
  .content{position:relative;z-index:2}

  /* ---------- 顶部 ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;justify-content:space-between;padding:14px 30px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:14px;color:var(--ink)}
  .brand .logo{
    width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--sky),var(--blue) 55%,var(--pink));
    box-shadow:0 4px 18px rgba(79,195,247,.5);font-size:15px;color:#08070f;
  }

  /* ========== Hero：暗房闪回开场 ========== */
  .hero{
    position:relative;min-height:100vh;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    padding:110px 20px 60px;text-align:center;
  }
  /* 暗房红光氛围 */
  .hero::after{
    content:'';position:absolute;right:5%;bottom:6%;width:300px;height:300px;pointer-events:none;
    background:radial-gradient(circle,rgba(255,143,184,.13),transparent 65%);filter:blur(22px);
  }
  .hero::before{
    content:'';position:absolute;left:8%;top:16%;width:260px;height:260px;pointer-events:none;
    background:radial-gradient(circle,rgba(79,195,247,.10),transparent 65%);filter:blur(24px);
  }
  /* 标题铭牌（居中央，相纸环绕） */
  .hero-plate{
    position:relative;z-index:6;text-align:center;padding:30px 50px 27px;border-radius:26px;
    background:linear-gradient(160deg,rgba(18,15,34,.78),rgba(10,8,22,.62));
    border:1px solid rgba(130,160,255,.24);
    box-shadow:0 0 44px rgba(79,195,247,.28),inset 0 0 34px rgba(111,139,255,.08);
    backdrop-filter:blur(8px);
  }
  .hero-plate .eyebrow{
    font-size:11px;letter-spacing:5px;color:var(--sky);font-weight:600;margin-bottom:12px;
  }
  .hero-plate h1{
    font-size:clamp(28px,4.6vw,46px);font-weight:800;letter-spacing:7px;white-space:nowrap;
    background:linear-gradient(115deg,#fff 8%,#bfe0ff 45%,#9fd4ff 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 16px rgba(79,195,247,.55));margin-bottom:9px;
  }
  .hero-plate .sub{font-size:12px;color:var(--muted);letter-spacing:2px;white-space:nowrap}
  .hero-plate .sub b{color:var(--gold);font-style:normal}

  /* 图片展示舞台（意识流碎片卡风格：圆角悬浮、无白边、发光） */
  .darkroom{position:absolute;inset:0;pointer-events:none}
  .card{
    position:absolute;left:50%;top:52%;width:190px;height:270px;border-radius:14px;overflow:hidden;
    pointer-events:auto;cursor:pointer;opacity:0;will-change:transform,opacity,filter;
    transform-origin:center center;
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 22px 54px rgba(5,8,30,.65);
    transition:box-shadow .4s ease,filter .4s ease,border-color .4s,opacity .9s ease;
  }
  .card .cover{
    position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));
    filter:grayscale(1) blur(5px) contrast(.8) brightness(.7);opacity:0;
  }
  .card .cover.develop{opacity:1;transition:filter 1.6s ease,opacity 1.4s ease;}
  .card .cover.done{filter:grayscale(0) blur(0) contrast(1.04) brightness(1)}
  .card .cover::after{content:'';position:absolute;inset:0;
    background:linear-gradient(180deg,transparent 40%,rgba(5,8,30,.62));}
  .card .glare{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;
    background:radial-gradient(120px 90px at 30% 22%,rgba(255,255,255,.28),transparent 62%);}
  .card .tag{position:absolute;left:11px;top:11px;z-index:2;font-size:10.5px;letter-spacing:2px;color:var(--gold);
    background:rgba(10,12,36,.55);padding:3px 9px;border-radius:99px;border:1px solid rgba(255,209,102,.4);
    opacity:0;transition:opacity .45s ease .05s;}
  .card .no{position:absolute;right:12px;top:12px;z-index:2;font-size:10px;letter-spacing:2px;
    color:rgba(236,233,246,.55);font-style:italic}
  .card .name{position:absolute;left:13px;right:13px;bottom:13px;z-index:2;font-size:14.5px;font-weight:600;
    letter-spacing:1px;color:#f4f6ff;text-shadow:0 2px 10px rgba(0,0,0,.75);
    opacity:0;transition:opacity .45s ease .1s;}
  .card.mount .tag,.card.mount .name{opacity:1}
  .card.mount{border-color:rgba(255,255,255,.2);
    box-shadow:0 24px 56px rgba(5,8,30,.7),0 0 34px rgba(111,139,255,.12);}
  .card:hover{border-color:rgba(255,255,255,.42);
    box-shadow:0 28px 64px rgba(5,8,30,.75),0 0 46px rgba(79,195,247,.22);}
  .card:hover .glare{opacity:1}

  /* 显影进度 */
  .dev-count{
    position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:20;
    font-size:12px;letter-spacing:3px;color:var(--muted);opacity:0;transition:opacity .4s;
  }
  .dev-count.show{opacity:1}
  .dev-count b{color:var(--pink);font-weight:800}
  /* 跳过开场 */
  .skip{
    position:fixed;right:22px;bottom:20px;z-index:40;font-family:inherit;font-size:11.5px;letter-spacing:1px;
    color:var(--muted);background:rgba(20,16,38,.6);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s;
  }
  .skip:hover{color:var(--ink);border-color:var(--sky)}
  .skip[hidden]{display:none}

  /* ---------- Story：逐部详解（沿用模板） ---------- */
  .story{max-width:1080px;margin:0 auto;padding:20px 24px 80px}
  .story-card{
    scroll-snap-align:start;
    position:relative;min-height:100vh;
    display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:46px;align-items:center;
    padding:70px 10px;scroll-margin-top:70px;
  }
  .story-card:not(:last-child){border-bottom:1px dashed rgba(255,255,255,.08)}
  .sc-no{
    position:absolute;right:2%;top:6%;font-size:120px;font-weight:900;line-height:1;
    color:transparent;-webkit-text-stroke:1.5px rgba(111,139,255,.28);
    pointer-events:none;z-index:0;letter-spacing:4px;
  }
  .sc-poster{
    position:relative;border-radius:18px;overflow:hidden;z-index:1;
    aspect-ratio:3/4;max-height:46vh;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:0 26px 60px rgba(0,0,0,.6);
    background:linear-gradient(160deg,#221a3a,#0d0a18);
  }
  .sc-poster::after{
    content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
    box-shadow:inset 0 0 0 1px transparent;transition:box-shadow .5s;
  }
  .story-card.in-view .sc-poster::after{
    box-shadow:inset 0 0 0 1px rgba(79,195,247,.55), 0 0 34px rgba(79,195,247,.28);
  }
  .sc-poster img{
    width:100%;height:100%;object-fit:cover;display:block;
    animation:kenburns 18s ease-in-out infinite alternate;animation-play-state:paused;
  }
  .story-card.in-view .sc-poster img{animation-play-state:running}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.12)}}
  .sc-poster .flag{
    position:absolute;left:12px;top:12px;z-index:2;
    font-size:11px;letter-spacing:1px;padding:4px 10px;border-radius:999px;
    color:#ffd9a6;background:rgba(255,143,77,.14);border:1px solid rgba(255,143,77,.35);
    backdrop-filter:blur(4px);
  }
  .sc-info{z-index:1;padding:10px 2px}
  .sc-info > *{opacity:0;transform:translateY(18px);transition:opacity .6s ease, transform .6s ease}
  .story-card.in-view .sc-info > *{opacity:1;transform:none}
  .story-card.in-view .sc-info > *:nth-child(1){transition-delay:.05s}
  .story-card.in-view .sc-info > *:nth-child(2){transition-delay:.15s}
  .story-card.in-view .sc-info > *:nth-child(3){transition-delay:.25s}
  .story-card.in-view .sc-info > *:nth-child(4){transition-delay:.35s}
  .sc-info .kicker{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:2px;
    color:var(--sky);font-weight:600;margin-bottom:12px;
  }
  .sc-info .kicker::before{content:"";width:22px;height:1px;background:linear-gradient(90deg,var(--sky),transparent)}
  .sc-info .cat{
    display:inline-block;font-size:12px;letter-spacing:1px;color:#0a0812;
    background:linear-gradient(120deg,var(--sky),var(--blue));
    padding:4px 12px;border-radius:999px;font-weight:700;margin-bottom:14px;
    box-shadow:0 4px 16px rgba(79,195,247,.4);
  }
  .sc-info h2{
    font-size:clamp(26px,3.6vw,40px);font-weight:800;letter-spacing:2px;line-height:1.15;
    background:linear-gradient(115deg,#fff 8%,#bfe0ff 45%,#9fd4ff 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 12px rgba(79,195,247,.5));
    margin-bottom:16px;
  }
  .sc-info .note{
    font-size:14.5px;line-height:1.9;color:var(--muted);margin-bottom:20px;max-width:56ch;
  }
  .sc-info .tags{display:flex;flex-wrap:wrap;gap:9px}
  .chip{
    font-size:12.5px;letter-spacing:.5px;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-weight:600;
  }
  .chip b{font-weight:800;font-size:11px}
  .s1{color:#b8c4da;background:rgba(163,174,196,.1)}
  .s2{color:#8fd0ff;background:rgba(79,195,247,.13);border-color:rgba(79,195,247,.4)}
  .s3{color:#a9c2ff;background:rgba(111,139,255,.14);border-color:rgba(111,139,255,.4)}
  .s4{color:#ffc07a;background:rgba(251,146,60,.14);border-color:rgba(251,146,60,.4)}
  .s5{
    color:#ffe08a;background:rgba(251,191,36,.13);border-color:rgba(251,191,36,.5);
    box-shadow:0 0 16px rgba(251,191,36,.22);
  }

  /* ---------- 底部轨道条（视频进度感） ---------- */
  .trackbar{
    position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;
    display:flex;align-items:center;gap:14px;
    background:rgba(20,16,38,.72);border:1px solid var(--line);
    border-radius:999px;padding:8px 18px;backdrop-filter:blur(14px);
    box-shadow:0 10px 34px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .4s;
    font-size:12.5px;letter-spacing:1px;color:var(--muted);
  }
  .trackbar.show{opacity:1;pointer-events:auto}
  .trackbar b{color:var(--ink);font-weight:800}
  .trackbar .cur{color:var(--pink)}
  .tb-progress{
    width:130px;height:3px;border-radius:999px;overflow:hidden;
    background:rgba(255,255,255,.09);opacity:0;transition:opacity .3s;
  }
  .trackbar.auto .tb-progress{opacity:1}
  .tb-progress i{
    display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--sky),var(--blue),var(--pink));
    box-shadow:0 0 12px rgba(79,195,247,.8);
  }
  .tb-progress i.run{animation:tbprog 6s linear forwards}
  @keyframes tbprog{from{width:0}to{width:100%}}
  /* 背景音乐：左下角紧凑胶囊（沿用模板） */
  .bgm-bar{
    position:fixed;left:14px;bottom:14px;z-index:50;
    display:flex;align-items:center;gap:8px;
    background:rgba(8,8,18,.82);border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:6px 12px;backdrop-filter:blur(10px);
    max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.45);
  }
  .bgm-bar[hidden]{display:none}
  .bgm-bar::before{
    content:'';width:6px;height:6px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--pink),var(--gold));
    box-shadow:0 0 10px rgba(255,143,184,.7);
  }
  .bgm-play,.bgm-mute{
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
    border-radius:50%;color:#fff;cursor:pointer;
    width:26px;height:26px;font-size:11px;line-height:1;flex:none;transition:all .2s;
  }
  .bgm-play:hover,.bgm-mute:hover{background:rgba(255,255,255,.15)}
  .bgm-mute.muted{color:#5a5a70}
  .bgm-name{
    font-size:12px;color:#fff;flex:none;max-width:110px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .bgm-progress{width:90px;height:4px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;cursor:pointer;flex:none}
  .bgm-progress i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--pink),var(--gold));box-shadow:0 0 8px rgba(255,143,184,.5)}
  .bgm-time{font-size:11px;color:#8b8ba3;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
  .auto-badge{
    position:fixed;top:74px;right:24px;z-index:30;
    display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;letter-spacing:1px;color:#08070f;
    background:linear-gradient(135deg,var(--sky),var(--blue) 60%,var(--pink));
    padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(79,195,247,.5);
  }
  .auto-badge[hidden]{display:none}
  .auto-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#08070f;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  @media (max-width:860px){
    .hero-plate{padding:20px 24px 18px}
    .hero-plate h1{font-size:24px;letter-spacing:4px}
    .hero-plate .sub{font-size:11px;letter-spacing:1px;white-space:normal}
    .card{width:150px;height:214px}
    .story-card{grid-template-columns:1fr;gap:20px;padding:36px 8px;text-align:center}
    .sc-poster{max-height:46vh}
    .sc-info .tags,.sc-info .kicker{justify-content:center}
    .sc-info .kicker::before{display:none}
    .sc-no{font-size:80px;top:1%}
    .auto-badge{right:14px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="clouds"></div>
<div class="content">
  <header class="topbar">
    <div class="brand"><span class="logo">✦</span><span>我的番剧推荐</span></div>
    <span class="auto-badge" id="autoBadge" hidden>✦ 自动导览中</span>
  </header>

  <!-- Hero：暗房闪回开场 -->
  <section class="hero" id="hero">
    <div class="darkroom" id="darkroom"></div>
    <div class="hero-plate">
      <div class="eyebrow">SEASON IN REVIEW</div>
      <h1>剧场 · 此刻</h1>
      <div class="sub"><b>✦</b>&nbsp; 12 部珍藏 · 逐张显影</div>
    </div>
    <div class="dev-count" id="devCount"><b id="devIdx">0</b> / 12 显影中</div>
    <button class="skip" id="skipBtn">跳过开场 ›</button>
  </section>

  <!-- Story：逐部详解 -->
  <main class="story" id="story"></main>

  <!-- 底部轨道条 -->
  <div class="trackbar" id="trackbar">
    <span>第 <b class="cur" id="tbCur">1</b> 部 / 共 <b id="tbTotal">0</b> 部</span>
    <div class="tb-progress"><i id="tbProg"></i></div>
  </div>

  <!-- 背景音乐（__BGM_SRC__/__BGM_NAME__ 由后端注入，空则隐藏）：左下角紧凑胶囊 -->
  <div class="bgm-bar" id="bgmBar" hidden>
    <button class="bgm-play" id="bgmPlayBtn" title="播放/暂停">▶</button>
    <span class="bgm-name" id="bgmName"></span>
    <div class="bgm-progress" id="bgmProgTrack" title="点击跳转进度"><i id="bgmProg"></i></div>
    <span class="bgm-time" id="bgmTime">0:00 / 0:00</span>
    <button class="bgm-mute" id="bgmMuteBtn" title="静音/取消静音">♪</button>
  </div>
  <audio id="bgmAudio" loop preload="auto"></audio>
</div>

<script>
/* ========== 数据注入（后端渲染时替换为真实媒体数据 JSON 数组） ==========
   正式版：const SLIDES = __SLIDES_JSON__;  字段 cover/title/flag/cat/note/tags */
const grad = (a, b) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/></svg>`);
const SLIDES = [
  { title:'勇者王FINAL',    flag:'热血', cat:'热血机甲', note:'燃烧到最后一刻的男人，和那台不会倒下的勇者机器人。', tags:[['热血',5],['机甲',3],['燃',4]], c1:'#4fc3f7', c2:'#6f8bff' },
  { title:'钢之炼金术师',   flag:'奇幻', cat:'奇幻冒险', note:'等价交换。为了取回弟弟的身体，踏上旅程——等价交换。', tags:[['奇幻',5],['神作',5],['冒险',3]], c1:'#6f8bff', c2:'#a78bfa' },
  { title:'青之芦苇',       flag:'运动', cat:'运动', note:'脚下的绿茵场，是梦想开始的地方。', tags:[['运动',4],['成长',3],['足球',4]], c1:'#ff8fb8', c2:'#f472b6' },
  { title:'星屑与黄昏',     flag:'治愈', cat:'治愈日常', note:'在黄昏的街道上，拾起那些温柔的碎片。', tags:[['治愈',4],['日常',3],['音乐',2]], c1:'#ffd166', c2:'#fb923c' },
  { title:'落第骑士',       flag:'战斗', cat:'战斗', note:'从垫底到顶点，靠的不是运气。', tags:[['战斗',4],['热血',3],['校园',2]], c1:'#4fc3f7', c2:'#34d399' },
  { title:'轻松熊',         flag:'日常', cat:'日常', note:'什么都不做，也是一种幸福。', tags:[['日常',4],['治愈',4],['萌',3]], c1:'#a78bfa', c2:'#ff8fb8' },
  { title:'地狱模式',       flag:'异世界', cat:'异世界', note:'这届异世界，难度系数拉满。', tags:[['异世界',4],['搞笑',3]], c1:'#6f8bff', c2:'#4fc3f7' },
  { title:'螺旋境界线',     flag:'科幻', cat:'科幻', note:'边界之外，是另一片宇宙。', tags:[['科幻',4],['悬疑',3],['太空',3]], c1:'#fb923c', c2:'#ffd166' },

  { title:'狼雨',           flag:'致郁', cat:'致郁', note:'寻找乐园的狼，和雪一起消失。', tags:[['致郁',4],['文艺',3],['动物',2]], c1:'#34d399', c2:'#4fc3f7' },

  { title:'爱的魔法',       flag:'搞笑', cat:'搞笑', note:'恋爱喜剧的最高境界，是让人笑着流泪。', tags:[['搞笑',4],['恋爱',3],['日常',2]], c1:'#a78bfa', c2:'#6f8bff' },
].map(s => ({ ...s, cover: grad(s.c1, s.c2) }));

/* 录制模式：?record=1 供视频渲染使用（忽略交互打断，全程自动导览） */
const IS_RECORD = new URLSearchParams(location.search).get('record') === '1';

/* ========== 背景音乐（__BGM_SRC__/__BGM_NAME__ 由后端注入，空则 BGM 区隐藏） ========== */
const BGM_SRC = "";
if (BGM_SRC) {
  const bgmAudio = document.getElementById('bgmAudio');
  const bgmBar = document.getElementById('bgmBar');
  const bgmPlayBtn = document.getElementById('bgmPlayBtn');
  const bgmMuteBtn = document.getElementById('bgmMuteBtn');
  const bgmProg = document.getElementById('bgmProg');
  const bgmTimeEl = document.getElementById('bgmTime');
  bgmAudio.src = BGM_SRC;
  bgmBar.hidden = false;
  document.getElementById('bgmName').textContent = "__BGM_NAME__";
  const fmtT = s => {
    if (!isFinite(s) || s <= 0) return '0:00';
    return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  };
  const updateTime = () => {
    const d = bgmAudio.duration || 0;
    bgmProg.style.width = (d ? (bgmAudio.currentTime / d) * 100 : 0) + '%';
    bgmTimeEl.textContent = fmtT(bgmAudio.currentTime) + ' / ' + fmtT(d);
  };
  const setPlay = playing => {
    bgmPlayBtn.textContent = playing ? '❚❚' : '▶';
    bgmPlayBtn.title = playing ? '暂停' : '播放';
  };
  bgmAudio.addEventListener('timeupdate', updateTime);
  bgmAudio.addEventListener('loadedmetadata', updateTime);
  bgmAudio.addEventListener('ended', () => { /* loop 循环 */ });
  bgmPlayBtn.addEventListener('click', () => {
    if (bgmAudio.paused) { bgmAudio.play().catch(() => {}); setPlay(true); }
    else { bgmAudio.pause(); setPlay(false); }
  });
  bgmMuteBtn.addEventListener('click', () => {
    bgmAudio.muted = !bgmAudio.muted;
    bgmMuteBtn.classList.toggle('muted', bgmAudio.muted);
    bgmMuteBtn.textContent = bgmAudio.muted ? '🔇' : '♪';
  });
  document.getElementById('bgmProgTrack').addEventListener('click', e => {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if (bgmAudio.duration) bgmAudio.currentTime = ratio * bgmAudio.duration;
  });
  if (IS_RECORD) {
    setTimeout(() => bgmAudio.play().catch(() => {}).then(() => setPlay(true)), 3000);
  }
}

/* ========== 星空粒子 ========== */
(() => {
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  let W, H, pts = [];
  const resize = () => { W = cv.width = innerWidth; H = cv.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  for (let i = 0; i < 70; i++) pts.push({
    x: Math.random() * W, y: Math.random() * H,
    r: Math.random() * 1.3 + .4,
    vy: Math.random() * .18 + .04,
    tw: Math.random() * Math.PI * 2, tws: Math.random() * .02 + .008
  });
  (function draw(){
    ctx.clearRect(0, 0, W, H);
    const hue = [200, 218, 262];
    for (const p of pts) {
      p.y -= p.vy; p.tw += p.tws;
      if (p.y < -4) { p.y = H + 4; p.x = Math.random() * W; }
      const a = .35 + Math.sin(p.tw) * .25;
      const h = hue[(Math.random() * hue.length) | 0];
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7);
      ctx.fillStyle = `hsla(${h},80%,78%,${a})`; ctx.fill();
    }
    requestAnimationFrame(draw);
  })();
})();

/* ========== 霓虹雾 ========== */
(() => {
  const wrap = document.getElementById('clouds');
  const sizes = [
    { w: 420, h: 160, x: 6,  y: 12, s: 15, d: 26 },
    { w: 320, h: 130, x: 74, y: 18, s: 18, d: 32 },
    { w: 520, h: 180, x: 40, y: 68, s: 12, d: 24 },
    { w: 260, h: 110, x: 16, y: 46, s: 22, d: 38 },

  ];
  for (const c of sizes) {
    const d = document.createElement('div');

    d.style.cssText = `width:${c.w}px;height:${c.h}px;left:${c.x}%;top:${c.y}%;animation-duration:${c.d}s;animation-delay:${-c.s}s;opacity:.55;`;
    wrap.appendChild(d);

})();

/* ========== 暗房闪回：相纸逐张显影 ========== */
const N = SLIDES.length;
const pad = n => String(n).padStart(2, '0');
const darkroom = document.getElementById('darkroom');
const devCount = document.getElementById('devCount');
const devIdx = document.getElementById('devIdx');
const skipBtn = document.getElementById('skipBtn');

/* 相纸就位 spot：随意散落（错落不均 + 大小对比 + 各自倾斜），中心标题区留白 */
const SPOTS = [
  { x:-44, y:-14, s:1.0,  r:-7  },
  { x:-26, y:-30, s:.64,  r: 5  },
  { x: -8, y:-25, s:.92,  r:-3  },
  { x: 18, y:-32, s:.6,   r: 9  },
  { x: 38, y:-20, s:.86,  r:-5  },
  { x: 42, y:-6,  s:1.12, r: 3  },
  { x:-42, y:  8, s:.58,  r: 8  },
  { x:-28, y: 20, s:1.06, r:-2  },
  { x:-10, y: 10, s:.68,  r: 6  },
  { x: 14, y: 22, s:.98,  r:-4  },
  { x: 30, y:  6, s:.66,  r: 7  },
  { x: 43, y: 16, s:.9,   r:-6  },
];

const pols = SLIDES.map((s, i) => {
  const p = document.createElement('div');
  p.className = 'card';
  p.style.setProperty('--c1', s.c1);
  p.style.setProperty('--c2', s.c2);
  p.style.transform = `translate(calc(-50% + ${SPOTS[i].x}vw), calc(-50% + ${SPOTS[i].y}vh)) scale(${SPOTS[i].s}) rotate(${SPOTS[i].r}deg)`;
  p.style.opacity = '0';
  p.innerHTML = `<div class="cover"></div><div class="glare"></div>
    <span class="tag">${s.flag}</span><span class="no">${pad(i + 1)}</span>
    <span class="name">${s.title}</span>`;
  darkroom.appendChild(p);
  return p;
});

let devTimers = [];
function develop(i, hold) {
  const p = pols[i];
  p.style.opacity = '1';
  p.querySelector('.cover').classList.add('develop');
  devIdx.textContent = pad(i + 1);
  devTimers.push(setTimeout(() => p.querySelector('.cover').classList.add('done'), hold));
}
function playDevelop() {
  devTimers.forEach(clearTimeout); devTimers = [];
  skipBtn.hidden = IS_RECORD;
  devCount.classList.add('show');
  pols.forEach(p => { p.classList.remove('mount'); p.style.opacity = '0';
    p.querySelector('.cover').classList.remove('develop', 'done'); });
  const DUR = 720, GAP = 50;
  /* 打乱显影顺序：不是一排排出现，而是随机四处浮现 */
  const order = SLIDES.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  let delay = 0;
  for (const idx of order) {
    devTimers.push(setTimeout(() => develop(idx, DUR), delay));
    delay += DUR + GAP;
  }
  devTimers.push(setTimeout(openWall, delay + 300));
}
function openWall() {
  devCount.classList.remove('show');
  pols.forEach((p, i) => {
    p.classList.add('mount');
    p.onclick = () => { stopAuto(); goto(i); };
  });
  /* 定场后自动导览（由下方 AUTOPLAY 逻辑在 AUTOPLAY_START 触发） */
}
function skipFlash() {
  devTimers.forEach(clearTimeout); devTimers = [];
  pols.forEach((p, i) => {
    p.style.opacity = '1';
    p.querySelector('.cover').classList.add('develop', 'done');
  });
  openWall();
  setTimeout(() => { beginAutoGuide(); }, 300);
}
skipBtn.addEventListener('click', skipFlash);

/* ========== 渲染 Story：逐部详解 ========== */
const story = document.getElementById('story');
const tbCur = document.getElementById('tbCur');
const tbTotal = document.getElementById('tbTotal');
const chip = ([name, n]) => {
  const tier = n >= 10 ? 5 : n >= 7 ? 4 : n >= 4 ? 3 : n >= 2 ? 2 : 1;
  return `<span class="chip s${tier}">${name}<b>×${n}</b></span>`;
};
SLIDES.forEach((s, i) => {
  const sc = document.createElement('section');
  sc.className = 'story-card'; sc.id = 'story-' + i;
  sc.innerHTML = `
    <span class="sc-no">${pad(i + 1)}</span>
    <div class="sc-poster">
      <img src="${s.cover}" alt="${s.title}" onerror="this.style.display='none'">
      <span class="flag">${s.flag}</span>
    </div>
    <div class="sc-info">
      <span class="kicker">PICK NO.${pad(i + 1)}</span>
      <div><span class="cat">✦ ${s.cat}</span></div>
      <h2>${s.title}</h2>
      <p class="note">${s.note}</p>
      <div class="tags">${s.tags.map(chip).join('')}</div>
    </div>`;
  story.appendChild(sc);
});
tbTotal.textContent = pad(N);
const cards = [...story.children];

/* 滚动进入视野 → 触发镜头缓推 + 信息逐行显现 */
const io = new IntersectionObserver(entries => {
  for (const e of entries) {
    if (e.isIntersecting) {
      e.target.classList.add('in-view');
      const n = cards.indexOf(e.target);
      if (n >= 0) tbCur.textContent = pad(n + 1);
    }
  }
}, { threshold: 0.45 });
cards.forEach(c => io.observe(c));

/* 底部轨道条：离开 hero 后浮现 */
const tb = document.getElementById('trackbar');
const hero = document.querySelector('.hero');
const trackbarIO = new IntersectionObserver(es => {
  for (const e of es) tb.classList.toggle('show', !e.isIntersecting);
}, { threshold: 0 });
trackbarIO.observe(hero);

/* ========== 自动导览：暗房显影完定场 → 逐部自动跳转 ========== */
const tbBar = document.getElementById('trackbar');
const prog = document.getElementById('tbProg');
const autoBadge = document.getElementById('autoBadge');
const AUTOPLAY_HOLD = 6000;      /* 每部停留时长（与 tbprog 动画同步） */
const AUTOPLAY_START = 10800;     /* 暗房闪回（~9.2s）+ 定格后开播 */
let entryTimer = null, autoTimer = null, autoIndex = 0, autoplaying = false;

function resetProg(){
  prog.classList.remove('run'); void prog.offsetWidth; prog.classList.add('run');
}
function beginAutoGuide(){
  if (autoplaying) return;
  autoplaying = true; autoIndex = 0;
  tbBar.classList.add('auto');
  autoBadge.hidden = false;
  goto(0);
  scheduleAuto();
}
function scheduleAuto(){
  resetProg();
  autoTimer = setTimeout(() => {
    autoIndex++;
    if (autoIndex >= SLIDES.length){
      finishAuto();
      window.scrollTo({ top: 0, behavior:'smooth' });
      return;
    }
    goto(autoIndex);
    scheduleAuto();
  }, AUTOPLAY_HOLD);
}
function finishAuto(){
  autoplaying = false;
  tbBar.classList.remove('auto');
  prog.classList.remove('run');
  autoBadge.hidden = true;
}
function stopAuto(){
  clearTimeout(entryTimer); clearTimeout(autoTimer);
  autoTimer = null; entryTimer = null;
  finishAuto();
}

/* 定位：点击相纸/瓦片 → 滚到对应 Story 卡（自动导览中同步重置倒计时条） */
function goto(i){
  if (autoplaying) resetProg();
  const el = document.getElementById('story-' + i);
  el.scrollIntoView({ behavior:'smooth', block:'start' });
  tbCur.textContent = pad(i + 1);
}

if (!IS_RECORD) {
  window.addEventListener('wheel', stopAuto, { passive:true });
  window.addEventListener('touchstart', stopAuto, { passive:true });
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') stopAuto();
    const n = cards.findIndex(c => c.classList.contains('in-view'));
    if (n < 0) return;
    if (e.key === 'ArrowRight') goto(Math.min(n + 1, N - 1));
    if (e.key === 'ArrowLeft') goto(Math.max(n - 1, 0));
  });
}

/* 开场闪回 + 定场后自动开播 */
playDevelop();
entryTimer = setTimeout(beginAutoGuide, AUTOPLAY_START);
</script>
