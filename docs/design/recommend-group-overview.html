<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分组模板 B · 总览导航式</title>
<style>
  :root{
    --bg-0:#07060d; --bg-1:#100e1e; --bg-2:#191428;
    --ink:#ece9f6; --muted:#9d97b8; --faint:#6b6690;
    --sky:#4fc3f7; --blue:#6f8bff; --pink:#ff8fb8; --gold:#ffd166;
    --line:rgba(255,255,255,.09);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:radial-gradient(1200px 700px at 78% -10%, rgba(79,195,247,.16), transparent 60%),
      radial-gradient(900px 600px at 8% 110%, rgba(111,139,255,.13), transparent 60%),
      linear-gradient(180deg,var(--bg-0),var(--bg-1) 55%,#0a0916);
    min-height:100vh;position:relative;overflow-x:hidden;
  }
  #stars{position:fixed;inset:0;pointer-events:none;opacity:.85;z-index:0}
  body::before{content:"";position:fixed;left:-10%;right:-10%;top:0;height:3px;
    background:linear-gradient(90deg,transparent,var(--sky),var(--blue),var(--pink),transparent);
    filter:blur(.5px);opacity:.9;z-index:2;animation:topline 9s ease-in-out infinite;}
  @keyframes topline{0%,100%{opacity:.5}50%{opacity:1}}
  .content{position:relative;z-index:2}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px 30px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:2px;font-size:14px;color:var(--ink)}
  .brand .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--sky),var(--blue) 55%,var(--pink));
    box-shadow:0 4px 18px rgba(79,195,247,.5);font-size:15px;color:#08070f;}
  .auto-badge{position:fixed;top:74px;right:24px;z-index:30;display:inline-flex;align-items:center;gap:6px;
    font-size:11.5px;letter-spacing:1px;color:#08070f;
    background:linear-gradient(135deg,var(--sky),var(--blue) 60%,var(--pink));
    padding:6px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(79,195,247,.5);}
  .auto-badge[hidden]{display:none}
  .auto-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#08070f;animation:blink 1.1s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}

  /* ========== 开场：暗房闪回 ========== */
  .hero{position:relative;min-height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:110px 20px 60px;}
  .hero::after{content:'';position:absolute;right:5%;bottom:6%;width:300px;height:300px;pointer-events:none;
    background:radial-gradient(circle,rgba(255,143,184,.13),transparent 65%);filter:blur(22px);}
  .hero-plate{position:relative;z-index:6;text-align:center;padding:28px 46px 25px;border-radius:26px;
    background:linear-gradient(160deg,rgba(18,15,34,.78),rgba(10,8,22,.62));
    border:1px solid rgba(130,160,255,.24);box-shadow:0 0 44px rgba(79,195,247,.28),inset 0 0 34px rgba(111,139,255,.08);
    backdrop-filter:blur(8px);}
  .hero-plate .eyebrow{font-size:11px;letter-spacing:5px;color:var(--sky);font-weight:600;margin-bottom:12px;}
  .hero-plate h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;letter-spacing:7px;white-space:nowrap;
    background:linear-gradient(115deg,#fff 8%,#bfe0ff 45%,#9fd4ff 85%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 16px rgba(79,195,247,.55));margin-bottom:9px;}
  .hero-plate .sub{font-size:12px;color:var(--muted);letter-spacing:2px}
  .hero-plate .sub b{color:var(--gold);font-style:normal}
  .darkroom{position:absolute;inset:0;pointer-events:none}
  .card{position:absolute;left:50%;top:50%;width:132px;height:188px;border-radius:12px;overflow:hidden;
    pointer-events:auto;cursor:pointer;opacity:0;transform-origin:center center;
    border:1px solid rgba(255,255,255,.14);box-shadow:0 18px 44px rgba(5,8,30,.65);
    transition:box-shadow .4s ease,opacity .8s ease;}
  .card .cover{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));
    filter:grayscale(1) blur(4px) contrast(.8) brightness(.7);opacity:0;}
  .card .cover.develop{opacity:1;transition:filter 1.5s ease,opacity 1.3s ease;}
  .card .cover.done{filter:grayscale(0) blur(0) contrast(1.04) brightness(1)}
  .card .cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,8,30,.62));}
  .card.mount{border-color:rgba(255,255,255,.2);box-shadow:0 20px 48px rgba(5,8,30,.7),0 0 30px rgba(111,139,255,.12);}
  .dev-count{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:20;font-size:12px;letter-spacing:3px;
    color:var(--muted);opacity:0;transition:opacity .4s;}
  .dev-count.show{opacity:1}
  .dev-count b{color:var(--pink);font-weight:800}
  .skip{position:fixed;right:22px;bottom:20px;z-index:40;font-family:inherit;font-size:11.5px;letter-spacing:1px;
    color:var(--muted);background:rgba(20,16,38,.6);border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;cursor:pointer;backdrop-filter:blur(8px);transition:.2s;}
  .skip:hover{color:var(--ink);border-color:var(--sky)}
  .skip[hidden]{display:none}

  /* ========== 顶部分组导航 ========== */
  .group-nav{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:25;
    display:flex;gap:6px;background:rgba(20,16,38,.7);border:1px solid var(--line);
    border-radius:999px;padding:5px;backdrop-filter:blur(12px);
    opacity:0;transition:opacity .6s ease .2s;}
  .group-nav.show{opacity:1}
  .group-nav .gn{font-family:inherit;font-size:12px;letter-spacing:1px;color:var(--muted);
    border:none;background:transparent;padding:6px 15px;border-radius:999px;cursor:pointer;transition:.25s;}
  .group-nav .gn:hover{color:var(--ink)}
  .group-nav .gn.cur{color:#0a0812;background:linear-gradient(120deg,var(--sky),var(--blue));
    font-weight:700;box-shadow:0 4px 14px rgba(79,195,247,.4)}

  /* ========== 总览页：分组选择 ========== */
  .overview{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:22px;padding:120px 20px 70px;}
  .ov-title{font-size:13px;letter-spacing:6px;color:var(--faint);font-weight:600;text-transform:uppercase;margin-bottom:6px}
  .ov-cards{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
  .ov-card{position:relative;width:250px;padding:24px 22px 20px;border-radius:18px;cursor:pointer;
    background:linear-gradient(160deg,rgba(20,16,38,.75),rgba(10,8,22,.6));
    border:1px solid var(--line);text-align:center;
    transition:transform .3s cubic-bezier(.2,1.3,.4,1),border-color .3s,box-shadow .3s;
    opacity:0;transform:translateY(26px);}
  .ov-card.in-view{opacity:1;transform:none}
  .ov-card:hover{transform:translateY(-6px);border-color:var(--cg);box-shadow:0 0 34px var(--cg);}
  .ov-card .og{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;
    font-size:20px;font-weight:900;color:#0a0812;background:linear-gradient(135deg,var(--cg),#fff);
    box-shadow:0 6px 18px var(--cg);}
  .ov-card h3{font-size:26px;font-weight:800;letter-spacing:2px;color:#fff}
  .ov-card .oc{font-size:12px;color:var(--muted);margin:8px 0 14px;letter-spacing:1px}
  .ov-card .oc b{color:var(--gold)}
  .ov-thumbs{display:flex;justify-content:center;gap:8px}
  .ov-thumbs img{width:52px;height:74px;object-fit:cover;border-radius:7px;border:1px solid rgba(255,255,255,.14)}
  .ov-card .go{position:absolute;right:14px;top:14px;font-size:16px;color:var(--faint);transition:.25s}
  .ov-card:hover .go{color:var(--cg);transform:translateX(3px)}

  /* ========== 组内 Story（display 切换） ========== */
  .group-view{display:none;min-height:100vh;padding:120px 24px 80px;max-width:1080px;margin:0 auto;}
  .group-view.show{display:block}
  .gv-head{text-align:center;padding:26px 0 10px;position:relative}
  .gv-head .gv-k{font-size:12px;letter-spacing:6px;color:var(--cg);font-weight:700;text-transform:uppercase}
  .gv-head h2{font-size:clamp(30px,5vw,54px);font-weight:900;letter-spacing:5px;margin-top:8px;
    background:linear-gradient(115deg,#fff 10%,var(--cg) 60%,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 22px var(--cg));}
  .gv-head p{font-size:12.5px;color:var(--muted);margin-top:10px;letter-spacing:2px}
  .gv-head p b{color:var(--gold)}
  .gv-list{margin-top:34px;display:flex;flex-direction:column;gap:20px}
  .gv-card{position:relative;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:26px;
    align-items:center;padding:20px;border-radius:18px;
    background:linear-gradient(160deg,rgba(20,16,38,.6),rgba(10,8,22,.4));
    border:1px solid var(--line);opacity:0;transform:translateY(22px);
    transition:opacity .7s ease,transform .7s ease,border-color .4s,box-shadow .4s;}
  .gv-card.in-view{opacity:1;transform:none}
  .gv-card.in-view{border-color:rgba(79,195,247,.28);box-shadow:0 18px 44px rgba(0,0,0,.4);}
  .gv-card .gv-poster{aspect-ratio:3/4;max-height:34vh;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
  .gv-card .gv-poster img{width:100%;height:100%;object-fit:cover;display:block}
  .gv-badge{position:absolute;right:0;top:20px;font-size:10.5px;letter-spacing:2px;color:#0a0812;
    background:linear-gradient(120deg,var(--cg),#fff);padding:4px 13px;border-radius:999px 0 0 999px;font-weight:700;
    opacity:0;transform:translateX(14px);transition:opacity .5s ease .2s,transform .5s ease .2s;}
  .gv-card.in-view .gv-badge{opacity:1;transform:none}
  .gv-info .gv-no{font-size:11px;letter-spacing:2px;color:var(--sky);font-weight:600}
  .gv-info .gv-cat{display:inline-block;font-size:11px;color:#0a0812;background:linear-gradient(120deg,var(--sky),var(--blue));
    padding:3px 10px;border-radius:999px;font-weight:700;margin:8px 0;}
  .gv-info h3{font-size:clamp(20px,2.6vw,28px);font-weight:800;letter-spacing:1px;color:#fff;margin-bottom:8px}
  .gv-info p{font-size:13.5px;line-height:1.8;color:var(--muted)}

  /* ========== 切换转场提示 ========== */
  .transition{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
    background:rgba(7,6,13,.88);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .38s;}
  .transition.show{opacity:1}
  .transition .tt-k{font-size:12px;letter-spacing:7px;color:var(--faint);font-weight:600;text-align:center}
  .transition h2{font-size:clamp(44px,9vw,92px);font-weight:900;letter-spacing:8px;text-align:center;margin-top:14px;
    background:linear-gradient(115deg,#fff 10%,var(--cg) 55%,#fff);
    -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px var(--cg));
    transform:scale(.9);transition:transform .5s cubic-bezier(.2,1.4,.4,1);}
  .transition.show h2{transform:scale(1)}
  .transition .tt-n{text-align:center;margin-top:16px;font-size:13px;letter-spacing:3px;color:var(--muted)}

  /* 底部轨道条 */
  .trackbar{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:20;
    display:flex;align-items:center;gap:14px;background:rgba(20,16,38,.72);border:1px solid var(--line);
    border-radius:999px;padding:8px 18px;backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .4s;font-size:12.5px;letter-spacing:1px;color:var(--muted);}
  .trackbar.show{opacity:1;pointer-events:auto}
  .trackbar b{color:var(--ink);font-weight:800}
  .trackbar .cur{color:var(--pink)}
  .tb-progress{width:150px;height:3px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.09);opacity:0;transition:opacity .3s;}
  .trackbar.auto .tb-progress{opacity:1}
  .tb-progress i{display:block;height:100%;width:0;border-radius:999px;
    background:linear-gradient(90deg,var(--sky),var(--blue),var(--pink));box-shadow:0 0 12px rgba(79,195,247,.8);}
  .tb-progress i.run{animation:tbprog 6s linear forwards}
  @keyframes tbprog{from{width:0}to{width:100%}}

  .bgm-bar{position:fixed;left:14px;bottom:14px;z-index:50;display:flex;align-items:center;gap:8px;
    background:rgba(8,8,18,.82);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;
    backdrop-filter:blur(10px);max-width:340px;box-shadow:0 6px 20px rgba(0,0,0,.45);}
  .bgm-bar[hidden]{display:none}
  .bgm-bar::before{content:'';width:6px;height:6px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--pink),var(--gold));box-shadow:0 0 10px rgba(255,143,184,.7);}
  .bgm-play,.bgm-mute{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
    border-radius:50%;color:#fff;cursor:pointer;width:26px;height:26px;font-size:11px;line-height:1;flex:none;transition:all .2s;}
  .bgm-name{font-size:12px;color:#fff;flex:none;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bgm-progress{width:90px;height:4px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;cursor:pointer;flex:none}
  .bgm-progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold))}
  .bgm-time{font-size:11px;color:#8b8ba3;white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}

  @media (max-width:860px){
    .group-nav{top:58px;max-width:92vw;overflow-x:auto}
    .ov-cards{flex-direction:column}
    .gv-card{grid-template-columns:1fr;gap:14px}
    .hero-plate{padding:18px 22px 16px}.hero-plate h1{font-size:22px;letter-spacing:4px}
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="content">
  <header class="topbar"><div class="brand"><span class="logo">✦</span><span>我的番剧推荐</span></div>
    <span class="auto-badge" id="autoBadge" hidden>✦ 自动导览中</span></header>

  <!-- 分组导航 -->
  <nav class="group-nav" id="groupNav"></nav>

  <section class="hero" id="hero">
    <div class="darkroom" id="darkroom"></div>
    <div class="hero-plate">
      <div class="eyebrow">SEASON IN REVIEW · GROUPED</div>
      <h1>剧场 · 此刻</h1>
      <div class="sub"><b>✦</b>&nbsp; 按年份分组 · 先选一组</div>
    </div>
    <div class="dev-count" id="devCount"><b id="devIdx">0</b> / 12 显影中</div>
    <button class="skip" id="skipBtn">跳过开场 ›</button>
  </section>

  <!-- 分组总览 -->
  <section class="overview" id="overview"></section>

  <!-- 组内视图容器 -->
  <div id="groupViews"></div>

  <!-- 切换转场 -->
  <div class="transition" id="transition"><div>
    <div class="tt-k" id="ttK">SWITCHING TO</div>
    <h2 id="ttTitle">—</h2>
    <div class="tt-n" id="ttNote"></div>
  </div></div>

  <div class="trackbar" id="trackbar">
    <span id="tbLabel">—</span>
    <div class="tb-progress"><i id="tbProg"></i></div>
  </div>

  <div class="bgm-bar" id="bgmBar" hidden>
    <button class="bgm-play" id="bgmPlayBtn">▶</button>
    <span class="bgm-name" id="bgmName"></span>
    <div class="bgm-progress" id="bgmProgTrack"><i id="bgmProg"></i></div>
    <span class="bgm-time" id="bgmTime">0:00 / 0:00</span>
    <button class="bgm-mute" id="bgmMuteBtn">♪</button>
  </div>
  <audio id="bgmAudio" loop preload="auto"></audio>
</div>

<script>
const grad=(a,b)=>'data:image/svg+xml;utf8,'+encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="400"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="300" height="400" fill="url(#g)"/></svg>`);
const SLIDES=[
  {title:'勇者王FINAL',year:2024,cat:'热血机甲',note:'燃烧到最后一刻的男人，和那台不会倒下的勇者机器人。',c1:'#4fc3f7',c2:'#6f8bff'},
  {title:'星屑与黄昏',year:2024,cat:'治愈日常',note:'在黄昏的街道上，拾起那些温柔的碎片。',c1:'#ffd166',c2:'#fb923c'},
  {title:'地狱模式',year:2024,cat:'异世界',note:'这届异世界，难度系数拉满。',c1:'#a78bfa',c2:'#ff8fb8'},
  {title:'螺旋境界线',year:2024,cat:'科幻',note:'边界之外，是另一片宇宙。',c1:'#fb923c',c2:'#ffd166'},
  {title:'钢之炼金术师',year:2023,cat:'奇幻冒险',note:'等价交换。为了取回弟弟的身体，踏上旅程。',c1:'#6f8bff',c2:'#a78bfa'},
  {title:'轻松熊',year:2023,cat:'日常',note:'什么都不做，也是一种幸福。',c1:'#34d399',c2:'#4fc3f7'},
  {title:'奇诺之旅',year:2023,cat:'旅行',note:'「世界并不美丽，却也因此美丽」。',c1:'#f472b6',c2:'#ff8fb8'},
  {title:'初音岛',year:2023,cat:'恋爱',note:'永不凋谢的樱花树，许下的约定。',c1:'#ffd166',c2:'#ff8fb8'},
  {title:'青之芦苇',year:2022,cat:'运动',note:'脚下的绿茵场，是梦想开始的地方。',c1:'#ff8fb8',c2:'#f472b6'},
  {title:'落第骑士',year:2022,cat:'战斗',note:'从垫底到顶点，靠的不是运气。',c1:'#4fc3f7',c2:'#34d399'},
  {title:'狼雨',year:2022,cat:'致郁',note:'寻找乐园的狼，和雪一起消失。',c1:'#30cfd0',c2:'#330867'},
  {title:'爱的魔法',year:2022,cat:'搞笑',note:'恋爱喜剧的最高境界，是让人笑着流泪。',c1:'#ff758c',c2:'#ff7eb3'},
].map(s=>({...s,cover:grad(s.c1,s.c2)}));

const IS_RECORD=new URLSearchParams(location.search).get('record')==='1';
const BGM_SRC="";
if(BGM_SRC){const a=document.getElementById('bgmAudio'),bar=document.getElementById('bgmBar'),
  pp=document.getElementById('bgmPlayBtn'),mt=document.getElementById('bgmMuteBtn'),
  pr=document.getElementById('bgmProg'),te=document.getElementById('bgmTime');
  a.src=BGM_SRC;bar.hidden=false;document.getElementById('bgmName').textContent="__BGM_NAME__";
  const f=s=>!isFinite(s)||s<=0?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  const up=()=>{const d=a.duration||0;pr.style.width=(d?(a.currentTime/d)*100:0)+'%';te.textContent=f(a.currentTime)+' / '+f(d);};
  a.addEventListener('timeupdate',up);a.addEventListener('loadedmetadata',up);
  pp.onclick=()=>{if(a.paused){a.play().catch(()=>{});pp.textContent='❚❚';}else{a.pause();pp.textContent='▶';}};
  mt.onclick=()=>{a.muted=!a.muted;mt.textContent=a.muted?'🔇':'♪';};
  document.getElementById('bgmProgTrack').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();if(a.duration)a.currentTime=((e.clientX-r.left)/r.width)*a.duration;};
  if(IS_RECORD)setTimeout(()=>a.play().catch(()=>{}),3000);}

/* 星空 */
(()=>{const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let W,H,pts=[];
  const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;};rs();addEventListener('resize',rs);
  for(let i=0;i<60;i++)pts.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.4,vy:Math.random()*.18+.04,tw:Math.random()*6,tws:Math.random()*.02+.008});
  (function d(){ctx.clearRect(0,0,W,H);const h=[200,218,262];for(const p of pts){p.y-=p.vy;p.tw+=p.tws;if(p.y<-4){p.y=H+4;p.x=Math.random()*W;}
    const a=.35+Math.sin(p.tw)*.25;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle=`hsla(${h[(Math.random()*3)|0]},80%,78%,${a})`;ctx.fill();}requestAnimationFrame(d);})();})();

const N=SLIDES.length,pad=n=>String(n).padStart(2,'0');
const darkroom=document.getElementById('darkroom'),devCount=document.getElementById('devCount'),
  devIdx=document.getElementById('devIdx'),skipBtn=document.getElementById('skipBtn');
const SPOTS=[
  {x:-42,y:-16,s:.9,r:-6},{x:-20,y:-30,s:.6,r:6},{x:0,y:-24,s:.84,r:-3},{x:22,y:-30,s:.6,r:8},
  {x:40,y:-18,s:.9,r:-4},{x:-40,y:12,s:.6,r:7},{x:-22,y:18,s:1.0,r:-2},{x:0,y:16,s:.66,r:5},
  {x:22,y:20,s:.92,r:-5},{x:40,y:10,s:.66,r:6},{x:-30,y:2,s:.6,r:4},{x:30,y:2,s:.62,r:-6}];
const pols=SLIDES.map((s,i)=>{const p=document.createElement('div');p.className='card';
  p.style.setProperty('--c1',s.c1);p.style.setProperty('--c2',s.c2);
  p.style.transform=`translate(calc(-50% + ${SPOTS[i].x}vw), calc(-50% + ${SPOTS[i].y}vh)) scale(${SPOTS[i].s}) rotate(${SPOTS[i].r}deg)`;
  p.innerHTML=`<div class="cover"></div>`;p.style.opacity='0';darkroom.appendChild(p);return p;});
let dt=[];
function develop(i){const p=pols[i];p.style.opacity='1';p.querySelector('.cover').classList.add('develop');
  devIdx.textContent=pad(i+1);dt.push(setTimeout(()=>p.querySelector('.cover').classList.add('done'),1500));}
function playDevelop(){dt.forEach(clearTimeout);dt=[];skipBtn.hidden=IS_RECORD;devCount.classList.add('show');
  pols.forEach(p=>{p.classList.remove('mount');p.style.opacity='0';p.querySelector('.cover').classList.remove('develop','done');});
  const order=SLIDES.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  let delay=0;for(const idx of order){dt.push(setTimeout(()=>develop(idx),delay));delay+=560;}
  dt.push(setTimeout(openWall,delay+200));}
function openWall(){devCount.classList.remove('show');pols.forEach(p=>p.classList.add('mount'));
  setTimeout(()=>{pols.forEach(p=>{p.style.transition='opacity 1s ease,transform 1s ease';p.style.opacity='0';p.style.transform+=' scale(.5)';});
    setTimeout(()=>{document.getElementById('hero').style.display='none';showView('overview');},900);},1100);}
function skipFlash(){dt.forEach(clearTimeout);dt=[];pols.forEach(p=>p.classList.add('mount'));
  document.getElementById('hero').style.display='none';showView('overview');}
skipBtn.onclick=skipFlash;

/* ========== 分组构建 ========== */
const GROUPS=[...new Set(SLIDES.map(s=>s.year))].sort((a,b)=>b-a);
const GGLOW=['#4fc3f7','#ff8fb8','#ffd166','#a78bfa','#34d399'];
const groupGlow=g=>GGLOW[GROUPS.indexOf(g)%GGLOW.length];

/* 分组导航 */
const nav=document.getElementById('groupNav');
const chipAll=document.createElement('button');chipAll.className='gn cur';chipAll.textContent='☰ 总览';
chipAll.onclick=()=>{stopAuto();showView('overview');};nav.appendChild(chipAll);
const chips={};
GROUPS.forEach(g=>{const b=document.createElement('button');b.className='gn';b.textContent=g+' 年';
  b.onclick=()=>{stopAuto();showGroup(g);};nav.appendChild(b);chips[g]=b;});

/* 总览页 */
const overview=document.getElementById('overview');
overview.innerHTML=`<div class="ov-title">COLLECTION · 分组总览</div><div class="ov-cards"></div>`;
const ovCards=overview.querySelector('.ov-cards');
const groupData={};
GROUPS.forEach(g=>{groupData[g]=SLIDES.filter(s=>s.year===g);
  const oc=document.createElement('div');oc.className='ov-card';
  oc.style.setProperty('--cg',groupGlow(g));
  oc.innerHTML=`<span class="go">→</span><div class="og">${g%100}</div>
    <h3>${g} 年</h3><p class="oc">本组 <b>${groupData[g].length}</b> 部</p>
    <div class="ov-thumbs">${groupData[g].map(s=>`<img src="${s.cover}" onerror="this.style.display='none'">`).join('')}</div>`;
  oc.onclick=()=>{stopAuto();showGroup(g);};
  ovCards.appendChild(oc);});
/* 总览入场 */
const ovIO=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in-view');ovIO.unobserve(e.target);}},{threshold:.3});
ovCards.querySelectorAll('.ov-card').forEach((c,i)=>{c.style.transitionDelay=(i*.12)+'s';ovIO.observe(c);});

/* 组内视图 */
const gvWrap=document.getElementById('groupViews');
const groupViews={};
GROUPS.forEach(g=>{
  const v=document.createElement('section');v.className='group-view';v.style.setProperty('--cg',groupGlow(g));
  v.innerHTML=`<div class="gv-head"><div class="gv-k">GROUP · ${g}</div><h2>${g} 年</h2>
    <p>本组 <b>${groupData[g].length}</b> 部作品</p></div><div class="gv-list"></div>`;
  const list=v.querySelector('.gv-list');
  groupData[g].forEach((s,j)=>{
    const c=document.createElement('div');c.className='gv-card';
    c.innerHTML=`<span class="gv-badge">${g} 年组 · ${j+1}/${groupData[g].length}</span>
      <div class="gv-poster"><img src="${s.cover}" alt="${s.title}" onerror="this.style.display='none'"></div>
      <div class="gv-info"><div class="gv-no">PICK ${pad(j+1)}</div><div><span class="gv-cat">✦ ${s.cat}</span></div>
      <h3>${s.title}</h3><p>${s.note}</p></div>`;
    list.appendChild(c);});
  gvWrap.appendChild(v);groupViews[g]=v;
  const vio=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){e.target.classList.add('in-view');
    const ci=list.querySelectorAll('.gv-card');const idx=[...ci].indexOf(e.target);if(idx>=0)tbLabel.innerHTML=`<b class="cur">${g} 年</b> · 第 ${idx+1}/${ci.length} 部`;}},{threshold:.45});
  list.querySelectorAll('.gv-card').forEach(c=>vio.observe(c));});

/* 视图切换 */
const trans=document.getElementById('transition'),ttTitle=document.getElementById('ttTitle'),
  ttNote=document.getElementById('ttNote'),ttK=document.getElementById('ttK'),navEl=document.getElementById('groupNav');
let curView='overview';
function setCur(){Object.entries(chips).forEach(([g,b])=>b.classList.toggle('cur',curView===g));
  chipAll.classList.toggle('cur',curView==='overview');}
function showView(v){
  overview.style.display=v==='overview'?'flex':'none';
  Object.entries(groupViews).forEach(([g2,el])=>el.classList.toggle('show',String(v)===g2));
  curView=v;setCur();
  tbLabel.innerHTML=v==='overview'?'<b class="cur">分组总览</b> · 选择分组':'';
  /* 立即浮现当前视图卡片：切换后直接加 in-view，不依赖 IntersectionObserver 时序 */
  if(v==='overview'){
    ovCards.querySelectorAll('.ov-card').forEach(c=>c.classList.add('in-view'));
  }else{
    const gv=groupViews[v];if(gv)gv.querySelectorAll('.gv-card').forEach(c=>c.classList.add('in-view'));
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function showGroup(g){
  trans.style.setProperty('--cg',groupGlow(g));
  ttK.textContent='SWITCHING TO · '+g;
  ttTitle.textContent=g+' 年';
  ttNote.textContent='本组 '+groupData[g].length+' 部作品';
  trans.classList.add('show');
  setTimeout(()=>{showView(g);trans.classList.remove('show');},620);
}

const tb=document.getElementById('trackbar'),tbLabel=document.getElementById('tbLabel');
const trackbarIO=new IntersectionObserver(es=>{for(const e of es)tb.classList.toggle('show',!e.isIntersecting);},{threshold:0});
trackbarIO.observe(document.querySelector('.hero'));

/* ========== 自动导览：总览 → 逐组逐部 ========== */
const tbBar=document.getElementById('trackbar'),prog=document.getElementById('tbProg'),autoBadge=document.getElementById('autoBadge');
const AUTOPLAY_START=11200;
let entryTimer=null,autoTimer=null,autoplaying=false;
let tour=null;   /* {mode, g, j} */
function resetProg(){prog.classList.remove('run');void prog.offsetWidth;prog.classList.add('run');}
function beginAutoGuide(){if(autoplaying)return;autoplaying=true;tbBar.classList.add('auto');autoBadge.hidden=false;
  tour={mode:'overview'};gotoTour();}
function gotoTour(){
  if(!autoplaying)return;resetProg();
  let hold=6000;
  if(tour.mode==='overview'){showView('overview');tbLabel.innerHTML='<b class="cur">分组总览</b> · 即将进入首组';hold=4200;tour={mode:'group',g:GROUPS[0],j:0};}
  else{
    const g=tour.g,list=groupData[g];
    if(tour.j<list.length){
      const c=gvWrap.querySelectorAll('.gv-card');const idx=[...c].findIndex(x=>x.textContent.includes(list[tour.j].title));
      if(idx>=0)c[idx].scrollIntoView({behavior:'smooth',block:'center'});
      tbLabel.innerHTML=`<b class="cur">${g} 年</b> · 第 ${tour.j+1}/${list.length} 部`;
      tour.j++;hold=6000;
    } else {
      const gi=GROUPS.indexOf(g);
      if(gi+1<GROUPS.length){const ng=GROUPS[gi+1];tour={mode:'group',g:ng,j:0};showGroup(ng);hold=2200;}
      else{finishAuto();window.scrollTo({top:0,behavior:'smooth'});return;}
    }
  }
  autoTimer=setTimeout(gotoTour,hold);
}
function finishAuto(){autoplaying=false;tbBar.classList.remove('auto');prog.classList.remove('run');autoBadge.hidden=true;}
function stopAuto(){clearTimeout(entryTimer);clearTimeout(autoTimer);autoTimer=null;entryTimer=null;finishAuto();}
if(!IS_RECORD){window.addEventListener('wheel',stopAuto,{passive:true});
  window.addEventListener('touchstart',stopAuto,{passive:true});}

playDevelop();
entryTimer=setTimeout(beginAutoGuide,AUTOPLAY_START);
</script>
</body>
</html>
