<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 H · 星光巡礼</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a22;color:#fff;overflow:hidden;height:100vh;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}

  .sky{position:fixed;inset:0;
    background:
      radial-gradient(70% 60% at 20% 15%, rgba(80,70,180,.22), transparent 60%),
      radial-gradient(60% 55% at 80% 80%, rgba(120,60,200,.18), transparent 60%),
      radial-gradient(45% 40% at 55% 45%, rgba(70,140,220,.12), transparent 60%),
      linear-gradient(180deg,#0b0b2e,#07071c)}
  /* 星云 + 星星 */
  .stars{position:fixed;inset:0;pointer-events:none;z-index:1}
  .star{position:absolute;border-radius:50%;background:#fff;
    animation:shine var(--d) ease-in-out infinite}
  @keyframes shine{0%,100%{opacity:.12;transform:scale(.6)}50%{opacity:1;transform:scale(1.25)}}
  .moon{position:fixed;top:9%;right:10%;z-index:2;width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #fff, #e8e4ff 45%, #b8b0ff 70%);
    box-shadow:0 0 50px rgba(220,215,255,.7), 0 0 120px rgba(190,180,255,.35);
    animation:moonGlow 5s ease-in-out infinite alternate}
  @keyframes moonGlow{from{box-shadow:0 0 40px rgba(220,215,255,.5)}to{box-shadow:0 0 70px rgba(220,215,255,.85)}}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
    padding:20px 28px}
  .brand{font-size:13px;font-weight:800;letter-spacing:3px;color:#cfc4ff}
  .brand b{color:#fff}
  .badge{font-size:11px;color:#8fb4ff;background:rgba(120,150,255,.1);border:1px solid rgba(140,170,255,.35);
    border-radius:99px;padding:5px 14px;letter-spacing:2px}

  .hero{position:fixed;top:6%;left:0;right:0;text-align:center;z-index:10;pointer-events:none}
  .hero h1{font-size:clamp(28px,5vw,52px);font-weight:800;letter-spacing:8px;color:#f0ecff;
    text-shadow:0 0 30px rgba(160,140,255,.6), 0 0 60px rgba(120,180,255,.3)}
  .hero .en{display:block;font-size:11px;letter-spacing:10px;color:#8a86c9;margin-top:10px}

  /* 漂浮星光卡片 */
  .card{position:absolute;z-index:5;text-align:center;
    animation:floaty var(--f) ease-in-out infinite;animation-delay:var(--fd)}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-16px) rotate(var(--r))}}
  .card .art{position:relative;overflow:hidden;border-radius:14px;margin:0 auto;
    background:rgba(20,20,50,.7);border:1px solid var(--edge);
    box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 24px var(--glow);
    animation:halo 4s ease-in-out infinite}
  .card:nth-child(even) .art{animation-delay:1.2s}
  @keyframes halo{0%,100%{box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 18px var(--glow)}50%{box-shadow:0 16px 40px rgba(0,0,0,.55), 0 0 34px var(--glow)}}
  .card .cover{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));opacity:.92}
  .card .cover::before{content:'';position:absolute;inset:0;
    background:radial-gradient(70% 50% at 50% 0%, rgba(255,255,255,.25), transparent 60%)}
  .card .n{position:absolute;z-index:6;left:10px;bottom:8px;color:#fff;font-size:12px;font-weight:700;
    text-shadow:0 2px 10px rgba(0,0,0,.7)}
  /* 卡片四角小星 */
  .card .spark{position:absolute;z-index:7;color:#ffe9a8;font-size:11px;text-shadow:0 0 8px rgba(255,233,168,.9);
    animation:sparkTwi 2.4s ease-in-out infinite}
  @keyframes sparkTwi{0%,100%{opacity:.3;transform:scale(.7) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(20deg)}}

  .card{opacity:0;animation:pop .8s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:var(--pd)}
  @keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars" id="stars"></div>
<div class="moon"></div>

<div class="top">
  <div class="brand">✦ <b>我的番剧推荐</b></div>
  <div class="badge">星夜巡礼 · 2026</div>
</div>
<div class="hero">
  <h1>星光巡礼</h1>
  <span class="en">STARLIT PARADE</span>
</div>

<script>
  const S=[
    {n:'勇者王FINAL',  c1:'#7a4a8a',c2:'#3a2a5a',e:'#e8c4ff',g:'rgba(220,170,255,.35)'},
    {n:'钢之炼金术师', c1:'#3a5a9a',c2:'#1a2a4a',e:'#9fc4ff',g:'rgba(150,190,255,.35)'},
    {n:'青之芦苇',     c1:'#2a6a5a',c2:'#12302a',e:'#9affe0',g:'rgba(150,255,220,.3)'},
    {n:'星屑与黄昏',   c1:'#8a4a7a',c2:'#3a1a3a',e:'#ffc8ea',g:'rgba(255,200,235,.35)'},
    {n:'落第骑士',     c1:'#9a3a3a',c2:'#4a1414',e:'#ffb4a0',g:'rgba(255,170,140,.35)'},
    {n:'轻松熊',       c1:'#7a6a3a',c2:'#3a2e12',e:'#ffe8a0',g:'rgba(255,225,150,.3)'},
    {n:'螺旋境界线',   c1:'#2a6a7a',c2:'#0e2e3a',e:'#9ae8ff',g:'rgba(150,230,255,.35)'},
    {n:'狼雨',         c1:'#5a5a8a',c2:'#24243a',e:'#c8ccff',g:'rgba(190,195,255,.35)'},
  ];
  const spots=[
    {x:.05,y:.30,w:126,h:180,r:3,f:5,bd:0},
    {x:.24,y:.16,w:112,h:160,r:-4,f:5.5,bd:.7},
    {x:.42,y:.28,w:140,h:200,r:2,f:4.8,bd:1.3},
    {x:.62,y:.14,w:112,h:160,r:-3,f:5.2,bd:1.9},
    {x:.80,y:.26,w:128,h:182,r:4,f:5.3,bd:2.4},
    {x:.13,y:.60,w:134,h:192,r:-3,f:5.1,bd:2.8},
    {x:.38,y:.56,w:116,h:166,r:3,f:5.4,bd:3.2},
    {x:.62,y:.62,w:130,h:186,r:-4,f:4.9,bd:3.5},
  ];
  S.forEach((s,i)=>{
    const sp=spots[i],c=document.createElement('div');c.className='card';
    c.style.left=(sp.x*100)+'%';c.style.top=(sp.y*100)+'%';
    c.style.setProperty('--r',sp.r+'deg');c.style.setProperty('--f',sp.f+'s');c.style.setProperty('--fd',sp.bd+'s');
    c.style.setProperty('--pd',(i*.09)+'s');
    const art=document.createElement('div');art.className='art';
    art.style.width=sp.w+'px';art.style.height=sp.h+'px';
    art.style.setProperty('--c1',s.c1);art.style.setProperty('--c2',s.c2);
    art.style.setProperty('--edge',s.e);art.style.setProperty('--glow',s.g);
    art.innerHTML='<div class="cover"></div><span class="n">'+s.n+'</span>';
    c.appendChild(art);
    ['tl','tr','bl','br'].forEach(p=>{
      const spk=document.createElement('span');spk.className='spark';spk.textContent='✦';
      spk.style[p==='tl'?'left':'right']='7px';spk.style[p==='tl'||p==='bl'?'top':'bottom']='6px';
      spk.style.animationDelay=(i*.2)+'s';c.appendChild(spk);});
    document.body.appendChild(c);
  });
  /* 星屑 */
  const stars=document.getElementById('stars');
  for(let i=0;i<60;i++){
    const st=document.createElement('div');st.className='star';
    const size=Math.random()*2.6+1;
    st.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;--d:${(Math.random()*3+1.8).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s;background:${['#fff','#ffe9a8','#c8d4ff'][i%3]}`;
    stars.appendChild(st);
  }
</script>
</body>
</html>
