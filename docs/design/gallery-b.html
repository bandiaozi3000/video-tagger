<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 B · 杂志年鉴</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#f1ece2;color:#1a1a1a;overflow:hidden;height:100vh;
    font-family:Georgia,"Songti SC",serif;
  }
  body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:radial-gradient(300px 300px at 20% 30%,rgba(0,0,0,.03),transparent),
               radial-gradient(400px 300px at 80% 70%,rgba(0,0,0,.03),transparent);}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 30px;border-bottom:1px solid rgba(26,26,26,.16)}
  .masthead{font-size:12px;letter-spacing:8px;text-transform:uppercase;font-family:"Helvetica Neue",sans-serif}
  .issue{font-size:11px;letter-spacing:3px;color:#777;font-family:"Helvetica Neue",sans-serif}

  .hero{position:fixed;top:7.5%;left:30px;z-index:10;pointer-events:none}
  .hero h1{font-size:clamp(34px,6vw,64px);font-weight:700;letter-spacing:-1px;line-height:1}
  .hero .sub{font-size:12px;letter-spacing:4px;color:#8a8a80;margin-top:10px;font-family:"Helvetica Neue",sans-serif}

  /* 封面块（错落 + 大序号） */
  .piece{position:absolute;z-index:5}
  .piece .idx{font-size:clamp(20px,2.6vw,34px);color:#1a1a1a;font-weight:700;letter-spacing:-1px;line-height:1}
  .piece .art{overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(0,0,0,.14);
    border:1px solid rgba(0,0,0,.06)}
  .piece .cover{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2))}
  .piece .art::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.42))}
  .piece .n{position:absolute;z-index:6;bottom:14px;left:14px;right:12px;color:#fff;
    font-size:13px;letter-spacing:1px}
  .piece .tag{position:absolute;z-index:6;top:12px;left:14px;color:#fff;font-size:10px;
    letter-spacing:3px;text-transform:uppercase;opacity:.85;font-family:"Helvetica Neue",sans-serif}

  .piece{opacity:0;animation:rise .9s ease forwards}
  .piece:nth-child(1){animation-delay:.1s}.piece:nth-child(2){animation-delay:.22s}
  .piece:nth-child(3){animation-delay:.34s}.piece:nth-child(4){animation-delay:.46s}
  .piece:nth-child(5){animation-delay:.58s}.piece:nth-child(6){animation-delay:.7s}
  @keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="top">
  <div class="masthead">✦ 我的番剧推荐</div>
  <div class="issue">ISSUE · 2026 年度特辑</div>
</div>
<div class="hero">
  <h1>年度番剧<br>年鉴</h1>
  <div class="sub">THE ANIME YEARBOOK 2026</div>
</div>

<script>
  const S=[
    {n:'勇者王FINAL',    t:'热 血',   c1:'#b0402a',c2:'#e8a050'},
    {n:'钢之炼金术师',   t:'奇 幻',   c1:'#284a6a',c2:'#8aa8c0'},
    {n:'青之芦苇',       t:'运 动',   c1:'#1a5a40',c2:'#70b890'},
    {n:'星屑与黄昏',     t:'治 愈',   c1:'#5a3870',c2:'#b898d0'},
    {n:'落第骑士',       t:'战 斗',   c1:'#742828',c2:'#d09848'},
    {n:'轻松熊',         t:'日 常',   c1:'#6a5838',c2:'#c8b890'},
  ];
  const spots=[
    {x:.05,y:.32,w:190,h:120,id:'001'},
    {x:.30,y:.20,w:240,h:150,id:'002'},
    {x:.60,y:.34,w:210,h:132,id:'003'},
    {x:.05,y:.62,w:230,h:144,id:'004'},
    {x:.42,y:.60,w:190,h:120,id:'005'},
    {x:.72,y:.58,w:250,h:156,id:'006'},
  ];
  S.forEach((s,i)=>{
    const sp=spots[i],p=document.createElement('div');p.className='piece';
    p.style.left=(sp.x*100)+'%';p.style.top=(sp.y*100)+'%';
    const idx=document.createElement('div');idx.className='idx';idx.textContent=sp.id;p.appendChild(idx);
    const art=document.createElement('div');art.className='art';
    art.style.width=sp.w+'px';art.style.height=sp.h+'px';
    art.style.setProperty('--c1',s.c1);art.style.setProperty('--c2',s.c2);
    art.innerHTML=`<div class="cover"></div><span class="tag">${s.t}</span><span class="n">${s.n}</span>`;
    p.appendChild(art);document.body.appendChild(p);
  });
</script>
</body>
</html>
