<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 C · 光影长廊</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#040407;color:#eaeaf0;overflow:hidden;height:100vh;
    font-family:"Helvetica Neue","PingFang SC",sans-serif}
  /* 空间氛围 */
  .tunnel{position:fixed;inset:0;
    background:
      radial-gradient(140% 90% at 50% 100%, rgba(40,60,120,.22), transparent 55%),
      radial-gradient(90% 60% at 50% 0%, rgba(90,80,180,.12), transparent 55%),
      #040407;}
  .tunnel::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);
    background:linear-gradient(180deg,transparent,rgba(120,130,200,.25),transparent);}
  .tunnel::after{content:'';position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(180deg,transparent,rgba(60,70,120,.18));}

  .top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:baseline;
    padding:22px 30px}
  .brand{font-size:12px;letter-spacing:5px;color:#9a9ab0;text-transform:uppercase}
  .brand b{color:#fff;letter-spacing:2px;font-weight:600}
  .hero{position:fixed;top:8%;left:0;right:0;text-align:center;z-index:10;pointer-events:none}
  .hero h1{font-size:clamp(26px,4.5vw,50px);font-weight:300;letter-spacing:14px;color:#fff}
  .hero .en{display:block;font-size:10px;letter-spacing:10px;color:#7d7d99;margin-top:12px;text-transform:uppercase}

  /* 玻璃海报（沿纵深排布，近大远小） */
  .poster{position:absolute;z-index:5}
  .poster .glass{overflow:hidden;position:relative;background:#0a0a14;
    border:1px solid rgba(160,170,220,.35);border-radius:2px;
    box-shadow:0 30px 70px rgba(0,0,0,.75), 0 0 40px rgba(90,100,180,.12);
    transform:perspective(900px) rotateY(var(--ry,0deg));}
  .poster .glass::before{content:'';position:absolute;inset:0;z-index:3;pointer-events:none;
    background:linear-gradient(115deg,rgba(255,255,255,.16) 0%,transparent 32%,transparent 70%,rgba(255,255,255,.06) 100%);}
  .poster .cover{position:absolute;inset:0;background:linear-gradient(160deg,var(--c1),var(--c2));filter:saturate(1.05)}
  .poster .glass::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(0,0,0,.5))}
  .poster .n{position:absolute;z-index:6;bottom:12px;left:12px;color:#fff;font-size:12px;letter-spacing:1px}
  /* 地板反光 */
  .poster .refl{position:absolute;left:0;right:0;top:100%;height:60%;z-index:1;
    background:linear-gradient(180deg,var(--c1),transparent);opacity:.14;transform:scaleY(-1);filter:blur(4px)}

  .poster{opacity:0;animation:fade 1.2s ease forwards}
  .poster:nth-child(1){animation-delay:.15s}.poster:nth-child(2){animation-delay:.3s}
  .poster:nth-child(3){animation-delay:.45s}.poster:nth-child(4){animation-delay:.6s}
  .poster:nth-child(5){animation-delay:.75s}.poster:nth-child(6){animation-delay:.9s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="tunnel"></div>

<div class="top">
  <div class="brand"><b>✦</b>&nbsp; 我的番剧推荐</div>
</div>
<div class="hero">
  <h1>长廊 · 光界</h1>
  <span class="en">Gallery of Light</span>
</div>

<script>
  const S=[
    {n:'勇者王FINAL',  c1:'#7a3a22',c2:'#2a0f08'},
    {n:'钢之炼金术师', c1:'#20384f',c2:'#0a1620'},
    {n:'青之芦苇',     c1:'#143a28',c2:'#05130c'},
    {n:'星屑与黄昏',   c1:'#3a2650',c2:'#120a1e'},
    {n:'落第骑士',     c1:'#551b1b',c2:'#200808'},
    {n:'轻松熊',       c1:'#4a3c22',c2:'#1a150a'},
  ];
  /* 沿中央走廊两侧排布：近处大（下方）、远处小（上方），两侧微旋转 */
  const spots=[
    {x:.14,y:.58,w:180,h:120,ry:-8},
    {x:.24,y:.34,w:130,h:88, ry:-4},
    {x:.38,y:.20,w:96,h:66,  ry:-2},
    {x:.58,y:.16,w:84,h:58,  ry:2},
    {x:.72,y:.30,w:124,h:84, ry:4},
    {x:.80,y:.54,w:168,h:114,ry:8},
  ];
  S.forEach((s,i)=>{
    const sp=spots[i],p=document.createElement('div');p.className='poster';
    p.style.left=(sp.x*100)+'%';p.style.top=(sp.y*100)+'%';
    const g=document.createElement('div');g.className='glass';
    g.style.width=sp.w+'px';g.style.height=sp.h+'px';
    g.style.setProperty('--ry',sp.ry+'deg');g.style.setProperty('--c1',s.c1);g.style.setProperty('--c2',s.c2);
    g.innerHTML='<div class="cover"></div><span class="n">'+s.n+'</span>';
    p.appendChild(g);
    const refl=document.createElement('div');refl.className='refl';refl.style.setProperty('--c1',s.c1);p.appendChild(refl);
    document.body.appendChild(p);
  });
</script>
</body>
</html>
